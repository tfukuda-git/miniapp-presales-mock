function insCard(ins,idx){
  return '<div class="card"><div class="ins-top"><div class="ins-ic">'+I.shield+'</div>'
    +'<div style="flex:1"><div class="ins-name">'+esc(ins.name)+'</div><div class="ins-co">'+esc(ins.co)+'</div></div>'
    +'<button class="ins-kebab" '+A("openEdit",idx)+'>'+I.kebab+'</button></div>'
    +'<div class="grid2"><div class="field"><div class="lbl">保険料</div><div class="val">'+esc(ins.fee)+'</div></div>'
    +'<div class="field"><div class="lbl">証券番号</div><div class="val">'+esc(ins.no||"—")+'</div></div></div>'
    +'<div class="field full"><div><div class="lbl">担当者・連絡先</div><div class="val">'+esc(ins.agent||"—")+' <span style="color:var(--muted);font-weight:400;font-size:13px">'+esc(ins.tel)+'</span></div></div>'
    +'<button class="callbtn" '+A("toast","発信: "+ins.tel)+'>'+I.phone+'</button></div>'
    +(ins.memo?'<div class="field full"><div><div class="lbl">メモ</div><div class="val">'+esc(ins.memo)+'</div></div></div>':'')
    +'<div class="share-row"><span class="lab">保険の共有</span><div class="tg'+(ins.shared?' on':'')+'" '+A("toggleShare",idx)+'></div></div></div>';
}
function screenHome(){
  return '<div class="head-row"><div><div class="h1">マイ保険</div><div class="sub">'+myInsurances.length+'件の保険を管理中</div></div>'
    +'<button class="btn-add" '+A("go","add")+'>'+I.plus+' 保険を追加</button></div>'
    +'<div class="note">保険情報の追加・編集・削除はご契約者本人のみ行えます（各保険カード右上の「⋮」メニューから）。変更があった場合はご自身で更新をお願いします。※'+CUST+'の契約も含め、当社での自動更新は行われません。共有された家族は閲覧のみ可能です。</div>'
    +(myInsurances.length? myInsurances.map(insCard).join("")
      : '<div class="card" style="text-align:center;color:var(--muted);padding:32px 16px"><div style="color:#cfd1d6;margin-bottom:8px;display:flex;justify-content:center">'+I.shield.replace('width="22" height="22"','width="34" height="34"')+'</div>まだ保険が登録されていません<div style="font-size:12.5px;margin-top:6px">右上の「保険を追加」から登録できます</div></div>');
}
function screenFamily(){
  var seg='<div class="seg"><button class="'+(state.famTab=="by"?"act":"")+'" '+A("setFam","by")+'>共有している</button>'
    +'<button class="'+(state.famTab=="with"?"act":"")+'" '+A("setFam","with")+'>共有されている</button></div>';
  var body="";
  if(state.famTab=="by"){
    body+='<div class="banner"><div class="t">'+myInsurances.filter(function(x){return x.shared;}).length+'件の保険が共有対象になっています</div><div class="d">マイ保険タブで共有のオン・オフを切り替えられます</div></div>';
    body+='<div class="row" style="background:var(--brand-soft)" '+A("go","invite")+'><div class="avatar" style="background:var(--brand)">'+I.plus+'</div>'
      +'<div><div class="nm" style="color:var(--brand)">共有相手を追加</div><div class="st" style="color:#b03a6b">LINEの友だちから選択</div></div><span class="chev">'+I.chev+'</span></div>';
    body+='<div class="section-label">共有されるユーザ</div>';
    body+=pendingInvites.map(function(p){return '<div class="row"><div class="avatar" style="background:#cfd3da">招</div><div><div class="nm">招待中（期限：'+p.exp+'まで）</div><div class="st muted">LINEで送信済み・相手の受け取り待ち</div></div></div>';}).join("");
    body+=(sharedMembers.length? sharedMembers.map(function(a){
      return '<div class="row" '+A("toast","共有設定を表示")+'><div class="avatar">'+a[1]+'</div>'
      +'<div><div class="nm">'+a[0]+'</div><div class="st">有効</div></div>'
      +'<button class="kebab" '+A("removeShare",a[0])+'>'+I.kebab+'</button></div>';}).join("")
      : (pendingInvites.length?'':'<div class="card" style="text-align:center;color:var(--muted);padding:22px 16px">共有している家族がまだいません</div>'));
  } else {
    body+='<div class="note">あなたが契約者になった場合も、「共有している」情報と「共有されている」情報の両方をここで確認できます。</div>';
    body+=(members.length? members.map(function(m,i){return '<div class="row" '+A("openMember",String(i))+'><div class="avatar">'+m.init+'</div>'
      +'<div><div class="nm">'+m.name+'</div><div class="st muted">'+m.insurances.length+'件の保険</div></div><span class="chev">'+I.chev+'</span></div>';}).join("")
      : '<div class="card" style="text-align:center;color:var(--muted);padding:22px 16px">共有された保険がまだありません</div>');
  }
  return '<div class="head-row"><div class="h1">共有相手</div></div>'+seg+body;
}

document.addEventListener("click",function(e){
  var el=e.target.closest ? e.target.closest("[data-act]") : null;
  if(!el)return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  switch(act){
    case "go": go(v?v:null); break;
    case "goTab": goTab(v); break;
    case "setFam": setFam(v); break;
    case "setStep": setStep(parseInt(v,10)); break;
    case "setMode": setMode(v); break;
    case "toggleC": toggleC(parseInt(v,10)); break;
    case "toggleP": toggleP(); break;
    case "toggleShare": toggleShare(parseInt(v,10)); break;
    case "openEdit": openEdit(parseInt(v,10)); break;
    case "openMember": openMember(parseInt(v,10)); break;
    case "openMemberIns": openMemberIns(v); break;
    case "registerDone": registerDone(); break;
    case "confirmManual": confirmManual(); break;
    case "attachPhoto": attachPhoto(); break;
    case "camAllow": camAllow(); break;
    case "camDeny": camDeny(); break;
    case "camShoot": camShoot(); break;
    case "saveProfile": saveProfile(); break;
    case "tuNext": tuNext(); break;
    case "tuSkip": tuSkip(); break;
    case "tuClose": tuClose(); break;
    case "openTutorial": openTutorial(); break;
    case "openProfileEdit": openProfileEdit(); break;
    case "saveProfileEdit": saveProfileEdit(); break;
    case "addBack": addBack(); break;
    case "saveEdit": saveEdit(); break;
    case "deleteIns": deleteIns(); break;
    case "inviteToggle": inviteToggle(); break;
    case "openPicker": openPicker(); break;
    case "pickerToggle": pickerToggle(v); break;
    case "pickerSend": pickerSend(); break;
