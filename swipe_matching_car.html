                {job.matchReason}
              </div>
            </div>
          </div>

          {/* Basics */}
          <div>
            <div className="wm-detail-section-title">基本情報</div>
            <dl className="wm-kv-grid">
              <dt>店舗所在地</dt><dd>{job.location}</dd>
              <dt>アクセス</dt><dd style={{fontWeight:500, color:'var(--wm-ink-700)'}}>{job.access}</dd>
              <dt>年式・走行</dt><dd>{job.shift}</dd>
              <dt>ボディタイプ</dt><dd>{job.category} / {job.subcategory}</dd>
            </dl>
          </div>

          {/* shift details */}
          <div>
            <div className="wm-detail-section-title">スペック</div>
            <div style={{display:'flex', flexDirection:'column', gap:6}}>
              {job.shiftDetails.map((s,i)=>(
                <div key={i} style={{
                  padding:'10px 12px', background:'var(--wm-ink-50)', borderRadius:10,
                  fontSize:13, fontWeight:600, display:'flex', alignItems:'center', gap:8
                }}>
                  <WM.Icon.Clock size={14}/>
                  <span>{s}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Highlights */}
          <div>
            <div className="wm-detail-section-title">おすすめポイント</div>
            <div style={{display:'flex', flexDirection:'column', gap:6}}>
              {job.highlights.map((h,i)=>(
                <div key={i} style={{display:'flex', gap:8, alignItems:'flex-start', fontSize:13, lineHeight:1.45}}>
                  <div style={{
                    color:'var(--wm-green-600)', flexShrink:0,
                    marginTop:3
                  }}>
                    <WM.Icon.Check size={14}/>
                  </div>
                  <span style={{fontWeight:600}}>{h}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Description */}
          <div>
            <div className="wm-detail-section-title">車両説明</div>
            <p style={{fontSize:13, lineHeight:1.7, margin:0, color:'var(--wm-ink-700)'}}>
              {job.desc}
            </p>
          </div>

          {/* Tags */}
          <div>
            <div className="wm-detail-section-title">特徴</div>
            <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
              {job.tags.map((t,i)=>(
                <WM.Chip key={i} variant={['green','amber','sky','rose'][i%4]}>{t}</WM.Chip>
              ))}
            </div>
          </div>

          {/* Welfare */}
          <div>
            <div className="wm-detail-section-title">保証・アフター</div>
            <ul style={{margin:0, padding:'0 0 0 18px', fontSize:13, color:'var(--wm-ink-700)', lineHeight:1.8}}>
              {job.welfare.map((w,i)=><li key={i}>{w}</li>)}
            </ul>
          </div>

          <div style={{
            fontSize:10, color:'var(--wm-ink-400)', textAlign:'center',
            fontFamily:'var(--wm-font-num)', marginTop:4
          }}>
            車両ID: {job.id}
          </div>
        </div>
      </div>

      {/* CTA buttons — context dependent */}
      <div className="wm-detail-cta">
        {origin === 'liked' && (
          <>
            <button onClick={onConsult} className="wm-btn-ghost" style={{flex:1}}>
              販売店に相談
            </button>
            <button onClick={onApply} className="wm-btn-primary" style={{flex:2, background:'var(--tg-500)'}}>
              来店予約に進む
            </button>
          </>
        )}
        {origin === 'skipped' && (
          <button onClick={onLike} className="wm-btn-primary" style={{flex:1}}>
            <WM.Icon.Heart size={18} fill="#fff" stroke="none"/>
            やっぱり気になる
          </button>
        )}
        {origin === 'swipe' && (
          <>
            <button onClick={handleExternalLink} className="wm-btn-ghost" style={{flex:1}}>
              詳細を見る
            </button>
            <button onClick={onLike} className="wm-btn-primary" style={{flex:2}}>
              <WM.Icon.Heart size={18} fill="#fff" stroke="none"/>
              気になる
            </button>
          </>
        )}
      </div>

      {/* External browser overlay */}
      {showExtOverlay && (
        <div style={{
          position:'absolute', inset:0, zIndex:100,
          background:'rgba(0,0,0,0.6)',
          display:'flex', alignItems:'center', justifyContent:'center',
          animation:'fadeIn 0.2s ease',
        }}>
          <div style={{
            background:'#fff', borderRadius:20, padding:'32px 28px',
            textAlign:'center', maxWidth:280,
            boxShadow:'0 20px 60px rgba(0,0,0,0.3)',
          }}>
            <div style={{
              width:56, height:56, borderRadius:'50%',
              background:'linear-gradient(135deg, #2a2eea, #5e60ff)',
              display:'flex', alignItems:'center', justifyContent:'center',
              margin:'0 auto 16px',
            }}>
              <span className="material-symbols-rounded" style={{fontSize:28, color:'#fff'}}>open_in_browser</span>
            </div>
            <div style={{fontSize:15, fontWeight:700, color:'#1a1a1a', marginBottom:8}}>
              外部ブラウザで表示
            </div>
            <div style={{fontSize:13, color:'#666', lineHeight:1.5}}>
              外部ブラウザで車両詳細ページを<br/>表示します
            </div>
            <div style={{
              marginTop:16, display:'flex', alignItems:'center', justifyContent:'center', gap:6,
              color:'#999', fontSize:12,
            }}>
              <span className="material-symbols-rounded" style={{fontSize:16, animation:'spin 1s linear infinite'}}>refresh</span>
              戻ります...
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

window.DetailScreen = DetailScreen;

  </script>

        <div className="wm-hist-tabs">
          <button
            className={`wm-hist-tab ${tab==='liked'?'active':''}`}
            onClick={()=>setTab('liked')}
          >
            <span
              className="material-symbols-rounded"
              style={{
                fontSize:16,
                color: tab==='liked' ? '#ff3b5c' : '#b0b3b0',
                fontVariationSettings: tab==='liked' ? "'FILL' 1" : "'FILL' 0"
              }}
            >favorite</span>
            <span>気になる</span>
            <span className="wm-hist-tab-count">{liked.length}</span>
          </button>
          <button
            className={`wm-hist-tab ${tab==='skipped'?'active':''}`}
            onClick={()=>setTab('skipped')}
          >
            <span
              className="material-symbols-rounded"
              style={{fontSize:16, color: tab==='skipped' ? '#1a1a1a' : '#b0b3b0'}}
            >close</span>

          <div className="wm-hist-empty">
            <div className="wm-hist-empty-icon">
              <span className="material-symbols-rounded" style={{fontSize:28, color:'#b0b3b0', fontVariationSettings:"'FILL' 1"}}>
                {tab==='liked' ? 'favorite' : 'history'}
              </span>
            </div>
            <div className="wm-hist-empty-title">
              {tab==='liked' ? 'まだ「気になる」がありません' : 'スキップしたクルマはありません'}
            </div>
            <div className="wm-hist-empty-sub">
              {tab==='liked'
                ? 'スワイプで気になるクルマを見つけましょう'
                : 'スキップしたクルマはここに記録されます'}
            </div>
          </div>
        )}

        {data.map((entry, i) => {
          const job = jobById[entry.jobId];
          if (!job) return null;
          return (
            <div key={i} className="wm-hist-card">
              <div className="wm-hist-thumb" onClick={()=>onOpenDetail(job, tab)}>
                {job.photo ? (
                  <img src={job.photo} alt="" style={{width:'100%', height:'100%', objectFit:'cover', display:'block'}}/>
                ) : (
                  <WM.JobArt job={job} labelOnly={true}/>
                )}
                {tab === 'liked' && (
                  <div className="wm-hist-thumb-badge">
                    <span className="material-symbols-rounded" style={{fontSize:12, color:'#fff', fontVariationSettings:"'FILL' 1"}}>favorite</span>
                  </div>
                )}
              </div>
              <div className="wm-hist-info" onClick={()=>onOpenDetail(job, tab)}>
                <div className="wm-hist-company">{job.company || job.subcategory}</div>
                <div className="wm-hist-title-text">{job.title}</div>
                <div className="wm-hist-meta">
                  <span className="wm-hist-wage">
                    ¥{job.wage.toLocaleString()}
                  </span>
                  <span className="wm-hist-dot">·</span>
                  <span>{job.locationShort}</span>
                </div>
                <div className="wm-hist-footer">
                  <span className="wm-hist-date">{entry.date}</span>
                  {entry.reason && entry.reason !== '-' && (
                    <span className="wm-hist-reason">{entry.reason}</span>
                  )}
                </div>
              </div>
              {tab === 'skipped' && (
                <button className="wm-hist-reconsider" onClick={()=>onReconsider(job)}>
                  再検討
                </button>
              )}
            </div>
          );
        })}

        {tab === 'skipped' && data.length > 0 && (
          <div className="wm-hist-tip">
            <span className="material-symbols-rounded" style={{fontSize:16, color:'#b58400'}}>lightbulb</span>
            <span>スキップしたクルマも、条件に合うものは「再検討」からもう一度確認できます</span>
          </div>
        )}
      </div>
    </div>
  );
}

window.HistoryScreen = HistoryScreen;

  </script>

  <script type="text/babel" data-presets="react">
/* ===== app.jsx ===== */
// Mico Car Match — root app orchestrator (v5)
function App() {
  const useState = React.useState;
  const useRef = React.useRef;
  const jobs = window.WM_JOBS;

  // First-launch state (in-memory for mock)
  const [isFirstLaunch, setIsFirstLaunch] = useState(true);

  const [screen, setScreen] = useState(() => {
    // Allow LP to set initial screen via ?screen= param
    const s = new URLSearchParams(window.location.search).get('screen');
    if (['swipe','history','complete'].includes(s)) return s;
    return 'tutorial'; // v5: start with tutorial
  });

  const [detailJob, setDetailJob] = useState(null);
  const [liked, setLiked] = useState([]);
  const [skipped, setSkipped] = useState([]);
  const [remaining, setRemaining] = useState(jobs.length); // budget = number of cards
  const [toast, setToast] = useState(null);
  const toastRef = useRef(null);
  const [likeSheet, setLikeSheet] = useState(null);
  const [feedbackSheet, setFeedbackSheet] = useState(null);
  const swipeCountRef = useRef(0);
  const swipeSeqRef = useRef(0);
  const [autoSwipe, setAutoSwipe] = React.useState(0);
  const [swipeKey, setSwipeKey] = React.useState(0);
  const autoSwipingRef = React.useRef(false);

  const showToast = (msg) => {
    if (toastRef.current) clearTimeout(toastRef.current);
    setToast(msg);
    toastRef.current = setTimeout(() => setToast(null), 2400);
  };

  const decrementAndCheckLimit = () => {
    setRemaining(r => {
      const next = Math.max(0, r - 1);
      if (next === 0) {
        setTimeout(() => setScreen('complete'), 300);
      }
      return next;
    });
  };

  const cancelPendingSheets = () => {
    ++swipeSeqRef.current;
    setLikeSheet(null);
    setFeedbackSheet(null);
    if (toastRef.current) {
      clearTimeout(toastRef.current);
      toastRef.current = null;
    }
    setToast(null);
  };

  // postMessage command listener — LP scroll-linking sends WM_CMD events
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type !== 'WM_CMD') return;
      setFeedbackSheet(null);
      setLikeSheet(null);
      if (d.screen) {
        setScreen(d.screen);
      }
      if (d.showFeedback) {
        setScreen('swipe');
        setTimeout(() => setFeedbackSheet({ job: jobs[0], firstTime: false }), 120);
      }
      if (d.swipeNope) {
        autoSwipingRef.current = true;
        setScreen('swipe');
        setAutoSwipe(n => n + 1);
        setTimeout(() => { autoSwipingRef.current = false; }, 600);
      }
      if (d.resetState) {
        setFeedbackSheet(null);
        setLikeSheet(null);
        setScreen('swipe');
        setRemaining(10);
        setLiked([]);
        setSkipped([]);
        setSwipeKey(k => k + 1);
      }
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const handleLike = (job) => {
    logEvent('add_favorite', eventParams(job));
    showToast(`Liked! 「${job.subcategory}」系のクルマが好みのようですね`);
    setLiked(arr => [{jobId: job.id, date: '今日', reason: '-'}, ...arr]);
    decrementAndCheckLimit();
  };

  const handleNope = (job) => {
    logEvent('swipe_nope', eventParams(job));
    setSkipped(arr => [{jobId: job.id, date: '今日', reason: '-'}, ...arr]);
    swipeCountRef.current += 1;
    decrementAndCheckLimit();
  };

  const handleLikeReasonSubmit = (reason) => {
    logEvent('like_reason', {jobID: likeSheet.id, reason});
    setLikeSheet(null);
  };

  const handleFeedbackSubmit = (reason) => {
    logEvent('feedback_submit', {jobID: feedbackSheet.job.id, reason});
    setFeedbackSheet(null);
  };

  const [detailOrigin, setDetailOrigin] = useState('swipe');
  const openDetail = (job, origin = 'swipe') => {
    logEvent('browse_product', eventParams(job));
    setDetailJob(job);
    setDetailOrigin(origin);
    setScreen('detail');
  };
  const handleApply = (job) => {
    logEvent('apply_start', eventParams(job));
    showToast('お問い合わせフォームを開きます（モック）');
    setScreen('swipe');
  };
  const handleConsult = (job) => {
    logEvent('consult_start', eventParams(job));
    showToast('LINE で販売店に相談（モック）');
  };

  const handleRestart = () => {
    setRemaining(jobs.length);
    setSwipeKey(k => k + 1);
    swipeCountRef.current = 0;
    setScreen('swipe');
  };

  const eventParams = (job) => ({
    jobID: job.id,
    category: job.category,
    subcategory: job.subcategory,
    wage: job.wage,
    location: job.location,
    shift: job.shift,
    tags: job.tags.join(','),
    match: job.match,
    companySize: job.companySize,
  });

  const logEvent = (name, params) => {
    console.log('[ME]', name, params);
  };

  const handleNav = (key, payload) => {
    if (key === 'detail' && payload) {
      openDetail(payload);
    } else {
      setScreen(key);
      if (key !== 'detail') setDetailJob(null);
    }
  };

  // Tutorial complete → go to questionnaire (first launch) or swipe
  const handleTutorialComplete = () => {
    if (isFirstLaunch) {
      setScreen('questionnaire');
    } else {
      setScreen('swipe');
    }
  };

  // Questionnaire complete → go to swipe
  const handleQuestionnaireComplete = (prefs) => {
    logEvent('questionnaire_complete', prefs);
    setIsFirstLaunch(false);
    setScreen('swipe');
  };

  // v5: no LIFF header / LineIntro for tutorial and questionnaire
  const showLiff = !['tutorial', 'questionnaire'].includes(screen);

  return (
    <div style={{position:'relative', width:'100%', height:'100%'}}>
      {/* Tutorial screen — full screen, no LIFF chrome */}
      {screen === 'tutorial' && (
        <TutorialScreen onComplete={handleTutorialComplete}/>
      )}

      {/* Questionnaire screen — full screen, no LIFF chrome */}
      {screen === 'questionnaire' && (
        <QuestionnaireScreen onComplete={handleQuestionnaireComplete}/>
      )}

      {/* Main app screens — with LIFF external header */}
      {showLiff && (
        <div className="wm-miniapp-sheet is-open" style={{position:'absolute', inset:0}}>
          <LineLiffHeader
            title="Mico Car Match"
            onClose={() => setScreen('tutorial')}
          />
          <div className="wm-liff-body with-liff">
            {screen === 'swipe' && (
              <SwipeScreen
                key={swipeKey}
                jobs={jobs}
                user={{name:'佐藤'}}
                liked={liked}
                onLike={handleLike}
                onNope={handleNope}
                onSwipeStart={cancelPendingSheets}
                onOpenDetail={openDetail}
                remaining={remaining}
                toastMsg={toast}
                autoSwipe={autoSwipe}
              />
            )}
            {screen === 'history' && (
              <HistoryScreen
                jobs={jobs}
                liked={liked}
                skipped={skipped}
                onOpenDetail={(job, tab) => openDetail(job, tab === 'liked' ? 'liked' : 'skipped')}
                onReconsider={(job) => openDetail(job, 'swipe')}
                remaining={remaining}
              />
            )}
            {screen === 'detail' && detailJob && (
              <DetailScreen
                job={detailJob}
                origin={detailOrigin}
                onBack={()=>setScreen(detailOrigin === 'swipe' ? 'swipe' : 'history')}
                onLike={()=>{ handleLike(detailJob); setScreen('swipe'); }}
                onSkip={()=>{ handleNope(detailJob); setScreen('swipe'); }}
                onApply={()=>handleApply(detailJob)}
                onConsult={()=>handleConsult(detailJob)}
                onExternalLink={()=>setScreen('swipe')}
              />
            )}
            {screen === 'complete' && (
              <LimitScreen
                jobs={jobs}
                liked={liked}
                swipeCount={swipeCountRef.current + liked.length}
                onNav={(k, p)=>{
                  handleNav(k, p);
                }}
                onRestart={handleRestart}
              />
            )}

            {/* No tab bar in v5 MVP — navigation via flow */}
            {/* Back to swipe button on history screen */}
            {screen === 'history' && (
              <div style={{
                position:'absolute', bottom:16, left:16, right:16, zIndex:20,
              }}>
                <button
                  className="wm-btn-primary"
                  style={{
                    width:'100%', background:'#2a2eea',
                    boxShadow:'0 4px 16px rgba(42,46,234,0.35)',
                  }}
                  onClick={()=>setScreen('swipe')}
                >
                  <span className="material-symbols-rounded" style={{fontSize:18, marginRight:4, verticalAlign:'middle'}}>arrow_back</span>
                  スワイプに戻る
                </button>
              </div>
            )}

            {/* Reason sheets removed in v5 MVP */}
          </div>
        </div>
      )}
    </div>
  );
}

window.App = App;

  </script>

  <script type="text/babel" data-presets="react">

function Host() {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const update = () => {
      const pad = 40;
      const sx = (window.innerWidth - pad) / 410;
      const sy = (window.innerHeight - pad) / 864;
      setScale(Math.min(sx, sy, 1.2));
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);
  return (
    <div style={{ width: 410 * scale, height: 864 * scale, position: 'relative' }}>
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'top left', width: 410, height: 864 }}>
        <IOSDevice width={390} height={844}>
          <div style={{position:'absolute', inset:0}}><App/></div>
        </IOSDevice>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('mount')).render(<Host/>);

  </script>
  <script>

(function() {
  const stage = document.getElementById('stage');
  const panel = document.getElementById('tweaks');
  function apply(t) {
    stage.classList.toggle('letterbox', t.letterbox !== 'off');
    document.body.classList.remove('theme-classic','theme-dark');
    document.body.classList.add('theme-' + (t.theme || 'classic'));
    document.body.classList.toggle('grain-off', t.grain === 'off');
  }
  apply(window.WM_TWEAKS || {});
  function readPanel(){return{theme:document.getElementById('tw-theme').value,grain:document.getElementById('tw-grain').value,letterbox:document.getElementById('tw-letterbox').value};}
  function writePanel(t){document.getElementById('tw-theme').value=t.theme||'classic';document.getElementById('tw-grain').value=t.grain||'on';document.getElementById('tw-letterbox').value=t.letterbox||'on';}
  writePanel(window.WM_TWEAKS || {});
  ['tw-theme','tw-grain','tw-letterbox'].forEach(id=>{document.getElementById(id).addEventListener('change',()=>{const t=readPanel();window.WM_TWEAKS=t;apply(t);});});
})();

  </script>
