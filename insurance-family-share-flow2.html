  var menu='<div class="rmbar">はなさく生命 リッチメニュー</div>'
    +'<div class="richmenu">'
    +'<div class="rt main" '+A("openMini","family")+'>'+I.shield+'<span>家族あんしん共有</span></div>'
    +'<div class="rt" '+A("openMini","member")+'>'+I.phone+'<span>緊急連絡先</span></div>'
    +'<div class="rt" '+A("toastB","お問い合わせ")+'>'+I.help+'<span>お問い合わせ</span></div></div>';
  return SB
    +'<div class="linehead"><div class="lav">'+I.shield+'</div><div>'+CUST+'<div style="font-size:11px;font-weight:400;opacity:.9">公式アカウント</div></div></div>'
    +'<div class="linechat" id="bbody"><div class="daystamp"><span>今日</span></div>'
    +'<div class="msg"><div class="mic">'+I.shield+'</div><div class="wrap"><div class="who">'+CUST+'</div>'
    +'<div class="bubble"><b>【家族あんしん共有】</b><br>'+OWNER+'さんとの保険情報の共有が開始されました。下のリッチメニュー、またはこのメッセージから内容をご確認いただけます。</div>'
    +'<div class="linkcard2"><div class="lc-top">'+I.shield+' 共有された保険を見る</div>'
    +'<div class="lc-d">'+OWNER+'さんの保険情報と緊急連絡先が確認できます。</div>'
    +'<div class="lc-btn" '+A("openMini","family")+'>ミニアプリで開く ›</div></div></div></div></div>'
    +menu+'<div class="toast" id="toastB"></div>';
}
/* ご家族のミニアプリ本体（契約者と同じ3タブUI） */
function closePill(){return '<div class="backbar"><button class="back" '+A("famGo","official")+'>'+I.back+' LINEトークに戻る</button></div>';}
function sharedBody(){
  var shared=myInsurances.filter(function(x){return x.shared;});
  var emg=emgBlock(shared,"toastB");
  var ins=shared.map(function(x){return '<div class="card"><div class="ins-top"><div class="ins-ic">'+I.shield+'</div><div><div class="ins-name">'+esc(x.name)+'</div><div class="ins-co">'+esc(x.co)+'</div></div></div>'
    +'<div class="grid2"><div class="field"><div class="lbl">保険料</div><div class="val">'+esc(x.fee)+'</div></div><div class="field"><div class="lbl">証券番号</div><div class="val">'+esc(x.no||"—")+'</div></div></div>'
    +'<div class="field full"><div><div class="lbl">担当者</div><div class="val">'+esc(x.agent)+' <span style="color:var(--muted);font-weight:400;font-size:13px">'+esc(x.tel)+'</span></div></div><button class="callbtn" '+A("toastB","発信")+'>'+I.phone+'</button></div></div>';}).join("");
  return '<div class="person-head"><div class="av">太</div><div class="nm">'+OWNER+'さん</div></div>'
    +'<div class="emg"><div class="et">'+I.alert+' 緊急連絡先</div><div class="ed">'+OWNER+'さんに万一の際はこちらへ</div>'+emg+'</div>'
    +'<div class="note">共有された情報は閲覧のみ可能です（編集・削除はできません）。</div>'
    +'<div class="sub-label">'+OWNER+'さんの保険</div>'+ins;
}
function fHome(){
  return closePill()
    +'<div class="head-row"><div><div class="h1">マイ保険</div><div class="sub">0件の保険を管理中</div></div><button class="btn-add" '+A("toastB","保険を追加")+'>'+I.plus+' 保険を追加</button></div>'
    +'<div class="note">ご自身の保険を登録すると、あなたもご家族に共有できます。'+OWNER+'さんから共有された情報は「共有相手」タブで確認できます。</div>'
    +'<div class="card" style="text-align:center;color:var(--muted);padding:32px 16px"><div style="color:#cfd1d6;margin-bottom:8px;display:flex;justify-content:center">'+I.shield.replace('width="22" height="22"','width="34" height="34"')+'</div>まだ登録された保険はありません</div>';
}
function fFamily(){
  var seg='<div class="seg"><button class="'+(famB.mfamTab=="by"?"act":"")+'" '+A("fsetFam","by")+'>共有している</button><button class="'+(famB.mfamTab=="with"?"act":"")+'" '+A("fsetFam","with")+'>共有されている</button></div>';
  var body="";
  if(famB.mfamTab=="with"){
    var cnt=myInsurances.filter(function(x){return x.shared;}).length;
    body='<div class="banner"><div class="t">'+OWNER+'さんから共有されています</div><div class="d">タップして保険情報と緊急連絡先を確認できます</div></div>'
      +'<div class="row" '+A("fgo","member")+'><div class="avatar">太</div><div><div class="nm">'+OWNER+'</div><div class="st muted">'+cnt+'件の保険</div></div><span class="chev">'+I.chev+'</span></div>';
  } else {
    body='<div class="row" style="background:var(--brand-soft)" '+A("toastB","共有相手を追加")+'><div class="avatar" style="background:var(--brand)">'+I.plus+'</div><div><div class="nm" style="color:var(--brand)">共有相手を追加</div><div class="st" style="color:#b03a6b">LINEの友だちから選択</div></div><span class="chev">'+I.chev+'</span></div>'
      +'<div class="card" style="text-align:center;color:var(--muted);padding:26px 16px">まだ共有していません</div>';
  }
  return closePill()+'<div class="head-row"><div class="h1">共有相手</div></div>'+seg+body;
}
function fSettings(){
  function item(ic,lab,right,act){return '<div class="set-item" '+(act||A("toastB",lab))+'><div class="set-ic">'+ic+'</div><div class="lab">'+lab+'</div><div class="rt">'+(right||"")+I.chev+'</div></div>';}
  var nm=famB.pname||FAM;
  return closePill()+'<div class="head-row"><div class="h1">設定</div></div>'
    +'<div class="profile"><div class="av">咲</div><div><div class="nm">'+esc(nm)+'</div><div class="meta">家族（共有された側） ・ LINE連携済み</div></div></div>'
    +'<div class="set-group"><div class="set-list">'+item(I.person,"プロフィール編集",nm,A("fopenProfileEdit"))+item(I.help,"アプリの使い方","",A("fopenTutorial"))+item(I.doc,"プライバシーポリシー","")+'</div></div>'
    +'<div class="ver">家族あんしん共有 v1.0.0<br>'+CUST+'保険株式会社</div>';
}
function fTutorial(){
  var steps=[
    {ic:I.shield,t:"共有された保険を確認",d:"ご家族が共有した保険情報を、このアプリでいつでも確認できます。"},
    {ic:I.phone,t:"もしもの時は緊急連絡先へ",d:"担当者や保険会社の窓口にワンタップで発信。いざというときにすぐ連絡できます。"},
    {ic:I.people,t:"ご自身の保険も共有できます",d:"あなた自身の保険を登録して、ご家族と共有することもできます。"}
  ];
  var s=famB.tuStep||0;var st=steps[s];var last=(s===steps.length-1);
  var dots=steps.map(function(_,i){return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(i===s?'var(--brand)':'#d8dae0')+'"></span>';}).join(" ");
  var top=famB.tuReplay
    ? '<div class="backbar"><button class="back" '+A("ftuClose")+'>'+I.back+' 設定に戻る</button></div>'
    : '<div style="text-align:right;padding:2px 2px 0"><span style="color:var(--muted);font-size:13px;cursor:pointer" '+A("ftuSkip")+'>スキップ</span></div>';
  var ic=st.ic.replace('width="22" height="22"','width="46" height="46"').replace('width="19" height="19"','width="44" height="44"');
  return top
    +'<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 10px 8px">'
    +'<div style="width:100px;height:100px;border-radius:30px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:26px">'+ic+'</div>'
    +'<h2 style="font-size:22px;margin:0 0 14px">'+st.t+'</h2>'
    +'<p style="color:var(--ink2);line-height:1.8;font-size:15px;max-width:290px;margin:0">'+st.d+'</p></div>'
    +'<div style="text-align:center;margin:22px 0 18px">'+dots+'</div>'
    +'<button class="btn btn-primary btn-block" '+A("ftuNext")+'>'+(last?(famB.tuReplay?'閉じる':'はじめる'):'次へ')+'</button>';
}
function fProfileEdit(){
  return '<div class="backbar"><button class="back" '+A("ftab","settings")+'>'+I.back+' 設定に戻る</button></div>'
    +'<div class="head-row"><div class="h1" style="font-size:22px">プロフィール編集</div></div>'
    +formFieldId("fpe_name","お名前","例）佐藤 美咲",famB.pname||FAM)
    +formFieldId("fpe_tel","電話番号","例）090-0000-0000",famB.ptel)
    +formFieldId("fpe_bd","生年月日","例）1990/01/01",famB.pbd)
    +'<div class="note">正式なお名前・連絡先をご登録ください。生年月日は同姓同名の識別に使用します。</div>'
    +'<button class="btn btn-primary btn-block" style="margin-top:4px" '+A("fsaveProfileEdit")+'>変更を保存</button>';
}
function fMember(){
  return '<div class="backbar"><button class="back" '+A("ftab","family")+'>'+I.back+' 共有相手に戻る</button></div>'+sharedBody();
}
function fRender(){
  var body,noTabs=false;
  if(!famB.tuDone||famB.mpage=="tutorial"){body=fTutorial();noTabs=true;}
  else if(famB.mpage=="profileEdit")body=fProfileEdit();
  else if(famB.mpage=="member")body=fMember();
  else if(famB.mtab=="home")body=fHome();
  else if(famB.mtab=="family")body=fFamily();
  else body=fSettings();
  var tabs=[["home","マイ保険",I.shield],["family","共有相手",I.people],["settings","設定",I.gear]];
  var tb=noTabs?'':'<div class="tabbar">'+tabs.map(function(t){return '<button class="'+((famB.mtab==t[0]&&!famB.mpage)?"act":"")+'" '+A("ftab",t[0])+'>'+t[2]+'<span>'+t[1]+'</span></button>';}).join("")+'</div>';
  return SB+'<div class="view"><div class="pad">'+body+'</div></div>'+tb+'<div class="toast" id="toastB"></div>';
}
function ftuNext(){if((famB.tuStep||0)<2){famB.tuStep=(famB.tuStep||0)+1;renderB();}else{ftuFinish();}}
function ftuFinish(){if(famB.tuReplay){famB.tuReplay=false;famB.tuStep=0;famB.mpage=null;famB.mtab="settings";}else{famB.tuDone=true;famB.tuStep=0;}renderB();}
function ftuSkip(){famB.tuDone=true;famB.tuStep=0;renderB();}
function ftuClose(){famB.tuReplay=false;famB.tuStep=0;famB.mpage=null;famB.mtab="settings";renderB();}
function fopenTutorial(){famB.tuReplay=true;famB.tuStep=0;famB.mpage="tutorial";renderB();}
function fopenProfileEdit(){famB.mpage="profileEdit";renderB();}
function fsaveProfileEdit(){var g=function(id){var el=document.getElementById(id);return el?String(el.value).trim():"";};var nm=g("fpe_name");if(!nm){toastB("お名前を入力してください");return;}famB.pname=nm;famB.ptel=g("fpe_tel");famB.pbd=g("fpe_bd");toastB("プロフィールを更新しました");famB.mpage=null;famB.mtab="settings";renderB();}
function famGo(step){famB.step=step;renderB();}
function openMini(v){famB.step="miniapp";if(v=="member"){famB.mtab="family";famB.mpage="member";}else{famB.mtab=v||"family";famB.mpage=null;}renderB();}
function ftab(t){famB.mtab=t;famB.mpage=null;renderB();}
function fgo(p){famB.mpage=p;renderB();}
function fsetFam(f){famB.mfamTab=f;renderB();}
function famConsent(){famB.consent=!famB.consent;if(!setCheck("fmcb","fmbtn",famB.consent))renderB();}
function famReceive(){if(!famB.consent){toastB("情報の取扱いへの同意が必要です");return;}var exists=sharedMembers.some(function(a){return a[0]==FAM;});if(!exists)sharedMembers.push([FAM,"咲"]);famB.step="official";renderB();render();toastB(CUST+" から共有開始のお知らせが届きました");toast(FAM+"さんが共有を受け取りました");}

/* ===== event delegation (インラインonclick非依存でクリック可能) ===== */
document.addEventListener("click",function(e){
  var el=e.target.closest ? e.target.closest("[data-act]") : null;
  if(!el)return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  switch(act){
    case "go": go(v?v:null); break;
    case "goTab": goTab(v); break;
    case "setFam": setFam(v); break;
    case "setStep": setStep(parseInt(v,10)); break;
    case "setMode": setMode(v); break;
    case "toggleC": toggleC(parseInt(v,10)); break;
    case "toggleP": toggleP(); break;
    case "toggleShare": toggleShare(parseInt(v,10)); break;
    case "openEdit": openEdit(parseInt(v,10)); break;
    case "openMember": openMember(parseInt(v,10)); break;
    case "registerDone": registerDone(); break;
    case "confirmManual": confirmManual(); break;
    case "attachPhoto": attachPhoto(); break;
    case "saveProfile": saveProfile(); break;
    case "tuNext": tuNext(); break;
    case "tuSkip": tuSkip(); break;
    case "tuClose": tuClose(); break;
    case "openTutorial": openTutorial(); break;
    case "openProfileEdit": openProfileEdit(); break;
    case "saveProfileEdit": saveProfileEdit(); break;
    case "addBack": addBack(); break;
    case "saveEdit": saveEdit(); break;
    case "deleteIns": deleteIns(); break;
    case "inviteConfirm": inviteConfirm(v); break;
    case "inviteToggle": inviteToggle(); break;
    case "inviteSend": inviteSend(v); break;
    case "removeShare": removeShare(v); break;
    case "toast": toast(v); break;
    case "famGo": famGo(v); break;
    case "famConsent": famConsent(); break;
    case "famReceive": famReceive(); break;
    case "openMini": openMini(v); break;
    case "ftab": ftab(v); break;
    case "fgo": fgo(v); break;
    case "fsetFam": fsetFam(v); break;
    case "ftuNext": ftuNext(); break;
    case "ftuSkip": ftuSkip(); break;
    case "ftuClose": ftuClose(); break;
    case "fopenTutorial": fopenTutorial(); break;
    case "fopenProfileEdit": fopenProfileEdit(); break;
    case "fsaveProfileEdit": fsaveProfileEdit(); break;
    case "toastB": toastB(v); break;
  }
});

render();
renderB();
</script>
<style>
#pwgate{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#26264a 0%,#15152b 55%,#0d0d1c 100%);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:"Noto Sans JP",system-ui,sans-serif;}
#pwgate.hide{display:none;}
#pwgate .pwbox{background:#fff;border-radius:18px;padding:30px 26px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
#pwgate .pwlock{display:flex;justify-content:center;margin-bottom:12px;color:#3438F0;}
#pwgate .pwttl{font-size:14px;font-weight:700;color:#1c1c1e;margin-bottom:4px;}
#pwgate .pwsub{font-size:11px;color:#8a8a8e;margin-bottom:16px;}
#pwgate input{width:100%;padding:12px 14px;border:1px solid #e6e6e6;border-radius:12px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;}
#pwgate button{width:100%;padding:13px;border:none;border-radius:12px;background:#3438F0;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;}
#pwgate #pwerr{color:#e0453a;font-size:12px;margin-top:10px;min-height:16px;}
</style>
<div id="pwgate"><div class="pwbox">
  <div class="pwlock"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7"/></svg></div>
  <div class="pwttl">パスワードを入力してください</div>
  <div class="pwsub">家族あんしん共有サービス デモ</div>
  <input id="pwin" type="password" placeholder="パスワード" autocomplete="off">
  <button id="pwbtn">表示する</button>
  <div id="pwerr"></div>
</div></div>
<script>
(function(){var PW="kazoku-anshin",K="hns_demo_ok";
var g=document.getElementById("pwgate"),i=document.getElementById("pwin"),e=document.getElementById("pwerr");
try{if(sessionStorage.getItem(K)==="1"){g.classList.add("hide");return;}}catch(_){}
function ok(){if(i.value===PW){try{sessionStorage.setItem(K,"1");}catch(_){}g.classList.add("hide");}else{e.textContent="パスワードが違います";i.value="";}}
document.getElementById("pwbtn").addEventListener("click",ok);
i.addEventListener("keydown",function(ev){if(ev.key==="Enter")ok();});
setTimeout(function(){i.focus();},100);})();
</script>



</body>
