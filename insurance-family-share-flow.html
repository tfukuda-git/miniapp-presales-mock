<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族あんしん共有 — ミニアプリ デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#009d96;
    --teal-btn:#2fa39a;
    --teal-soft:#e3f2f0;
    --bg:#f6f7f9;
    --field:#f0f1f3;
    --ink:#1c1c1e;
    --ink2:#3a3a3c;
    --muted:#8a8a8e;
    --line:#ececef;
    --amber:#e8941f;
    --amber-soft:#fff6e6;
    --red:#e0453a;
    --red-soft:#fdeceb;
    --blue:#2e6fdb;
    --blue-soft:#e9f1fd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 30%,#26264a 0%,#15152b 55%,#0d0d1c 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:24px 12px;color:var(--ink);
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .caption{color:#aeb0c8;font-size:13px;letter-spacing:.02em;text-align:center;}
  /* phone frame */
  .phone{
    position:relative;width:390px;height:800px;background:#0a0a0a;border-radius:52px;
    padding:13px;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 2px #2a2a2e inset;
  }
  .screen{
    position:relative;width:100%;height:100%;background:var(--bg);border-radius:40px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:50;}
  .statusbar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;color:#000;z-index:40;}
  .statusbar .icons{display:flex;gap:6px;align-items:center;}
  .statusbar svg{display:block;}
  /* scroll area */
  .view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .view::-webkit-scrollbar{display:none;}
  .pad{padding:8px 20px 28px;}
  /* headers */
  .h1{font-size:26px;font-weight:700;letter-spacing:.01em;}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 0 14px;}
  /* card */
  .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(20,20,40,.06),0 1px 1px rgba(20,20,40,.04);margin-bottom:14px;}
  .ins-top{display:flex;gap:12px;align-items:flex-start;}
  .ins-ic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;color:var(--teal);}
  .ins-name{font-size:16px;font-weight:700;line-height:1.35;}
  .ins-co{font-size:13px;color:var(--teal);margin-top:1px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .field{background:var(--field);border-radius:12px;padding:10px 12px;}
  .field .lbl{font-size:11px;color:var(--muted);}
  .field .val{font-size:15px;font-weight:500;margin-top:2px;color:var(--ink);}
  .field.full{margin-top:10px;display:flex;align-items:center;justify-content:space-between;}
  .callbtn{flex:0 0 40px;height:40px;border-radius:50%;background:#e6e7ea;display:flex;align-items:center;justify-content:center;color:#6a6a70;border:none;cursor:pointer;}
  .callbtn.tealc{background:var(--teal);color:#fff;}
  .callbtn.greenc{background:#1a9c45;color:#fff;}
  .share-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:6px;}
  .share-row .lab{font-size:15px;font-weight:500;}
  /* toggle */
  .tg{width:52px;height:31px;border-radius:18px;background:#d7d8dc;position:relative;cursor:pointer;transition:background .2s;flex:0 0 52px;}
  .tg.on{background:var(--teal);}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
  .tg.on::after{transform:translateX(21px);}
  /* primary button */
  .btn{border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:14px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--teal-btn);color:#fff;}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,20,40,.08);}
  .btn-add{background:var(--teal-btn);color:#fff;border-radius:22px;padding:11px 18px;font-size:14px;font-weight:700;}
  .btn-block{width:100%;}
  /* segmented */
  .seg{display:flex;background:#e9eaed;border-radius:14px;padding:5px;margin:6px 0 16px;}
  .seg button{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:9px 0;border-radius:10px;cursor:pointer;}
  .seg button.act{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  /* info banner */
  .banner{background:#e8f4f3;border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .banner .t{font-size:14px;font-weight:700;color:var(--teal);}
  .banner .d{font-size:12px;color:#5a7a78;margin-top:2px;}
  .section-label{font-size:13px;color:var(--muted);margin:14px 2px 8px;display:flex;align-items:center;gap:6px;}
  .section-label.amber{color:var(--amber);font-weight:600;}
  /* list row */
  .row{background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:13px;box-shadow:0 1px 3px rgba(20,20,40,.06);margin-bottom:12px;cursor:pointer;}
  .row.pending{border:1.5px solid #f4d58a;background:#fffdf8;}
  .avatar{flex:0 0 46px;height:46px;border-radius:50%;background:#cfd3da;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:17px;overflow:hidden;}
  .row .nm{font-size:16px;font-weight:700;}
  .row .st{font-size:13px;color:var(--teal);margin-top:1px;}
  .row .st.amber{color:var(--amber);font-weight:600;}
  .row .st.muted{color:var(--muted);}
  .row .chev{margin-left:auto;color:#c2c2c8;}
  .row .kebab{margin-left:auto;color:#b5b5bb;background:none;border:none;cursor:pointer;padding:6px;}
  /* back btn */
  .backbar{padding:6px 0 12px;}
  .back{display:inline-flex;align-items:center;gap:7px;background:#fff;border:none;border-radius:22px;padding:9px 16px;font-family:inherit;font-size:14px;font-weight:600;color:var(--teal);box-shadow:0 1px 3px rgba(20,20,40,.08);cursor:pointer;}
  /* steps */
  .steps{display:flex;gap:8px;margin:6px 0 4px;}
  .steps .bar{flex:1;height:4px;border-radius:3px;background:#dfe1e5;}
  .steps .bar.on{background:var(--teal);}
  .steplabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px;padding:0 6px;}
  .steplabels .on{color:var(--teal);font-weight:600;}
  .center-title{text-align:center;margin-bottom:4px;}
  .center-title h2{font-size:21px;font-weight:700;}
  .center-title p{font-size:13px;color:var(--muted);margin-top:6px;}
  /* camera frame */
  .camera{background:#16161f;border-radius:18px;height:280px;margin:18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6a6a78;position:relative;}
  .camera .frame{position:absolute;inset:24px;border-radius:12px;border:2px solid rgba(255,255,255,.35);}
  .camera .corner{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:4px;}
  .camera small{font-size:12px;margin-top:12px;}
  .ok-banner{background:#eaf7ee;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:8px;color:#1f8a43;font-size:13px;font-weight:600;margin-bottom:14px;}
  .res-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
  .res-row:last-child{border-bottom:none;}
  .res-ic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;color:var(--teal);}
  .res-row .lbl{font-size:12px;color:var(--muted);}
  .res-row .val{font-size:15px;font-weight:500;margin-top:2px;}
  .consent-box{border-radius:14px;padding:16px;margin-bottom:14px;}
  .consent-box.blue{background:var(--blue-soft);}
  .consent-box.amber{background:var(--amber-soft);}
  .consent-box .ct{font-size:14px;font-weight:700;margin-bottom:8px;}
  .consent-box.blue .ct{color:var(--blue);}
  .consent-box.amber .ct{color:var(--amber);}
  .consent-box li{list-style:none;font-size:13px;line-height:1.7;}
  .consent-box.blue li{color:#2f5aa8;}
  .consent-box.amber li{color:#a9701a;}
  .check-row{display:flex;gap:12px;align-items:flex-start;background:var(--field);border-radius:12px;padding:14px;margin-bottom:16px;cursor:pointer;}
  .cb{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid #c2c2c8;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px;}
  .cb.on{background:var(--teal);border-color:var(--teal);}
  .check-row .ctxt{font-size:14px;line-height:1.5;}
  /* profile / settings */
  .profile{background:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(20,20,40,.06);margin-bottom:8px;}
  .profile .av{flex:0 0 52px;height:52px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
  .profile .nm{font-size:18px;font-weight:700;}
  .profile .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .set-group{margin-top:18px;}
  .set-group .gl{font-size:13px;color:var(--muted);margin:0 4px 8px;}
  .set-list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(20,20,40,.06);}
  .set-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .set-item:last-child{border-bottom:none;}
  .set-ic{flex:0 0 30px;height:30px;border-radius:8px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;color:var(--teal);}
  .set-item .lab{font-size:15px;font-weight:500;}
  .set-item .rt{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;}
  .set-item.logout .lab{color:var(--red);}
  .ver{text-align:center;font-size:12px;color:var(--muted);margin-top:24px;line-height:1.7;}
  /* emergency */
  .emg{background:var(--red-soft);border-radius:18px;padding:16px;margin-bottom:18px;}
  .emg .et{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:15px;}
  .emg .ed{font-size:13px;color:#b5564e;margin:6px 0 12px;}
  .emg-card{background:#fff;border-radius:13px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .emg-card:last-child{margin-bottom:0;}
  .emg-ic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--field);display:flex;align-items:center;justify-content:center;color:var(--teal);}
  .emg-card .lbl{font-size:12px;color:var(--muted);}
  .emg-card .val{font-size:15px;font-weight:600;margin-top:1px;}
  .emg-card .callbtn{margin-left:auto;}
  .person-head{display:flex;align-items:center;gap:14px;margin:4px 0 18px;}
  .person-head .av{flex:0 0 56px;height:56px;border-radius:50%;background:#cfd3da;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
  .person-head .nm{font-size:21px;font-weight:700;}
  .approve-head{text-align:center;padding:18px 0 6px;}
  .approve-head .av{width:84px;height:84px;border-radius:50%;background:#cfd3da;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;margin:0 auto 12px;}
  .approve-head .nm{font-size:21px;font-weight:700;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600;padding:5px 12px;border-radius:16px;margin-top:8px;}
  .approve-card .at{font-size:17px;font-weight:700;margin-bottom:8px;}
  .approve-card .ad{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:16px;}
  .approve-actions{display:flex;gap:12px;}
  .approve-actions .btn{flex:1;}
  .sub-label{font-size:17px;font-weight:700;margin:4px 2px 12px;}
  /* bottom nav */
  .tabbar{flex:0 0 70px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:10px;}
  .tabbar button{flex:1;border:none;background:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:11px;color:#b3b3b8;cursor:pointer;font-size:11px;font-weight:600;}
  .tabbar button.act{color:var(--teal);}
  /* toast */
  .toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1c1e;color:#fff;font-size:13px;padding:11px 18px;border-radius:22px;opacity:0;transition:all .25s;z-index:60;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>

  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  bell:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 19a2 2 0 004 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6"/></svg>',
  link:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="6" y="3" width="12" height="18" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  help:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .8-1.5 1.3-1.5 2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>',
  alert:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1" fill="currentColor"/></svg>',
  camera:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13.5" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 7l1.5-2h5L16 7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  upload:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 16V5M8 9l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
};

/* ---------- state ---------- */
var state = {tab:"home", famTab:"by", page:null, addStep:0, consent:false};

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}

/* ---------- screens ---------- */
function insCard(ins,idx){
  return '<div class="card">'
    +'<div class="ins-top"><div class="ins-ic">'+I.shield+'</div>'
    +'<div><div class="ins-name">'+esc(ins.name)+'</div><div class="ins-co">'+esc(ins.co)+'</div></div></div>'
    +'<div class="grid2"><div class="field"><div class="lbl">証券番号</div><div class="val">'+esc(ins.no)+'</div></div>'
    +'<div class="field"><div class="lbl">月額</div><div class="val">'+esc(ins.fee)+'</div></div></div>'
    +'<div class="field full"><div><div class="lbl">担当者</div><div class="val">'+esc(ins.agent)+' <span style="color:var(--muted);font-weight:400;font-size:13px">'+esc(ins.tel)+'</span></div></div>'
    +'<button class="callbtn" onclick="toast(\'発信: '+esc(ins.tel)+'\')">'+I.phone+'</button></div>'
    +'<div class="share-row"><span class="lab">保険の共有</span><div class="tg'+(ins.shared?' on':'')+'" onclick="toggleShare('+idx+',this)"></div></div>'
    +'</div>';
}
function screenHome(){
  var cards = myInsurances.map(insCard).join("");
  return '<div class="head-row"><div><div class="h1">マイ保険</div><div class="sub">'+myInsurances.length+'件の保険を管理中</div></div>'
    +'<button class="btn-add" onclick="go(\'add\')">'+I.plus+' 保険を追加</button></div>'+cards;
}
function screenFamily(){
  var seg='<div class="seg"><button class="'+(state.famTab=="by"?"act":"")+'" onclick="setFam(\'by\')">共有している</button>'
    +'<button class="'+(state.famTab=="with"?"act":"")+'" onclick="setFam(\'with\')">共有されている</button></div>';
  var body="";
  if(state.famTab=="by"){
    body+='<div class="banner"><div class="t">3件の保険を共有中</div><div class="d">マイ保険タブで共有のオン・オフを切り替えられます</div></div>';
    body+='<div class="section-label amber">'+I.clock+' 承認待ち</div>';
    body+='<div class="row pending" onclick="go(\'approve\')"><div class="avatar" style="background:#c9a25a">咲</div>'
      +'<div><div class="nm">佐藤 美咲</div><div class="st amber">承認してください</div></div><span class="chev">'+I.chev+'</span></div>';
    body+='<div class="section-label">共有中</div>';
    body+=['田中 花子|花','田中 一郎|郎'].map(function(p){var a=p.split("|");
      return '<div class="row" onclick="toast(\'共有設定を表示\')"><div class="avatar">'+a[1]+'</div>'
      +'<div><div class="nm">'+a[0]+'</div><div class="st">共有中</div></div>'
      +'<button class="kebab" onclick="event.stopPropagation();toast(\'共有を管理\')">'+I.kebab+'</button></div>';}).join("");
  } else {
    body+=members.map(function(m,i){
      return '<div class="row" onclick="go(\'member\')"><div class="avatar">'+m.init+'</div>'
      +'<div><div class="nm">'+m.name+'</div><div class="st muted">'+m.count+'件の保険</div></div><span class="chev">'+I.chev+'</span></div>';}).join("");
  }
  return '<div class="head-row"><div class="h1">共有相手</div></div>'+seg+body;
}
function screenSettings(){
  function item(ic,lab,right,extra){return '<div class="set-item '+(extra||"")+'" onclick="toast(\''+lab+'\')"><div class="set-ic">'+ic+'</div><div class="lab">'+lab+'</div><div class="rt">'+(right?right:"")+(extra=="logout"?"":I.chev)+'</div></div>';}
  return '<div class="head-row"><div class="h1">設定</div></div>'
    +'<div class="profile"><div class="av">太</div><div><div class="nm">田中 太郎</div><div class="meta">契約者 ・ LINE連携済み</div></div></div>'
    +'<div class="set-group"><div class="gl">アカウント</div><div class="set-list">'
      +item(I.person,"プロフィール","田中 太郎")
      +item(I.link,"LINE連携","連携済み")
      +item(I.bell,"通知設定","ON")+'</div></div>'
    +'<div class="set-group"><div class="gl">セキュリティ</div><div class="set-list">'
      +item(I.lock,"パスコード設定","設定済み")
      +item(I.shield,"共有管理","2名に共有中")+'</div></div>'
    +'<div class="set-group"><div class="gl">サポート</div><div class="set-list">'
      +item(I.help,"使い方ガイド","")
      +item(I.doc,"利用規約・プライバシーポリシー","")
      +'<div class="set-item logout" onclick="toast(\'ログアウト\')"><div class="set-ic" style="background:var(--red-soft);color:var(--red)">'+I.back+'</div><div class="lab">ログアウト</div></div>'
      +'</div></div>'
    +'<div class="ver">家族あんしん共有 v1.0.0<br>'+CUST+'保険株式会社</div>';
}
function screenAdd(){
  var s=state.addStep;
  var steps='<div class="steps"><div class="bar on"></div><div class="bar'+(s>=1?' on':'')+'"></div><div class="bar'+(s>=2?' on':'')+'"></div></div>'
    +'<div class="steplabels"><span class="'+(s==0?'on':'')+'">撮影</span><span class="'+(s==1?'on':'')+'">確認</span><span class="'+(s==2?'on':'')+'">同意</span></div>';
  var backLab = s==0?"マイ保険に戻る":"戻る";
  var bar='<div class="backbar"><button class="back" onclick="addBack()">'+I.back+' '+backLab+'</button></div>';
  var body="";
  if(s==0){
    body='<div class="center-title"><h2>保険証券を読み取る</h2><p>証券または名刺をカメラで撮影してください</p></div>'
      +'<div class="camera"><div class="frame"></div>'
      +'<div class="corner" style="top:14px;left:14px;border-right:none;border-bottom:none"></div>'
      +'<div class="corner" style="top:14px;right:14px;border-left:none;border-bottom:none"></div>'
      +'<div class="corner" style="bottom:14px;left:14px;border-right:none;border-top:none"></div>'
      +'<div class="corner" style="bottom:14px;right:14px;border-left:none;border-top:none"></div>'
      +I.camera+'<small>枠内に証券を合わせてください</small></div>'
      +'<div style="display:flex;gap:12px"><button class="btn btn-primary" style="flex:1.2" onclick="setStep(1)">'+I.camera.replace('width="40" height="40"','width="18" height="18"')+' 撮影する</button>'
      +'<button class="btn btn-ghost" style="flex:1" onclick="setStep(1)">'+I.upload+' アルバムから</button></div>';
  } else if(s==1){
    var rows=ocrResult.map(function(r){
      var ic = r.lbl=="契約者名"||r.lbl=="担当者名"?I.person:(r.lbl=="証券番号"||r.lbl=="月額保険料"?I.card:I.doc);
      return '<div class="res-row"><div class="res-ic">'+ic+'</div><div><div class="lbl">'+r.lbl+'</div><div class="val">'+esc(r.val)+'</div></div></div>';}).join("");
    body='<div class="center-title"><h2>読み取り結果を確認</h2><p>内容に誤りがあれば修正してください</p></div>'
      +'<div class="ok-banner">'+I.check+' OCRで自動読み取りが完了しました</div>'
      +'<div class="card" style="padding:4px 16px">'+rows+'</div>'
      +'<button class="btn btn-primary btn-block" onclick="setStep(2)">この内容で次へ進む</button>';
  } else {
    body='<div class="center-title"><h2>第三者提供への同意</h2><p>家族への情報共有にあたり、同意が必要です</p></div>'
      +'<div class="consent-box blue"><div class="ct">共有される情報</div><ul>'
      +'<li>・保険会社名・保険種類</li><li>・証券番号</li><li>・月額保険料</li><li>・担当者名・連絡先</li></ul></div>'
      +'<div class="consent-box amber"><div class="ct">ご注意ください</div><ul>'
      +'<li>・共有先の家族が閲覧リクエストを送信後、あなたの承認が必要です</li>'
      +'<li>・いつでも共有を停止できます</li>'
      +'<li>・共有された情報は暗号化されて保管されます</li></ul></div>'
      +'<div class="check-row" onclick="toggleConsent()"><div class="cb'+(state.consent?' on':'')+'">'+(state.consent?I.check:"")+'</div>'
      +'<div class="ctxt">上記の内容を理解し、家族への情報共有に同意します</div></div>'
      +'<button class="btn btn-primary btn-block" style="opacity:'+(state.consent?1:.45)+'" onclick="registerDone()">同意して保険を登録する</button>';
  }
  return bar+steps+body;
}
function screenApprove(){
  return '<div class="backbar"><button class="back" onclick="go(null)">'+I.back+' 共有相手に戻る</button></div>'
    +'<div class="approve-head"><div class="av" style="background:#c9a25a">咲</div><div class="nm">佐藤 美咲さん</div>'
    +'<div class="pill">'+I.clock+' 承認待ち</div></div>'
    +'<div class="card approve-card" style="margin-top:18px"><div class="at">共有の承認</div>'
    +'<div class="ad">佐藤 美咲さんがあなたの保険情報の共有を申請しています。承認すると、マイ保険で共有をオンにした保険情報が共有されます。</div>'
    +'<div class="approve-actions"><button class="btn btn-ghost" onclick="afterApprove(\'共有を拒否しました\')">拒否する</button>'
    +'<button class="btn btn-primary" onclick="afterApprove(\'共有を承認しました\')">承認する</button></div></div>';
}
function screenMember(){
  var m=memberDetail;
  var emg=m.emergency.map(function(e){
    return '<div class="emg-card"><div class="emg-ic">'+(e.green?I.shield:I.person)+'</div>'
      +'<div><div class="lbl">'+esc(e.lbl)+'</div><div class="val">'+esc(e.val)+'</div></div>'
      +'<button class="callbtn '+(e.green?'greenc':'tealc')+'" onclick="toast(\'発信\')">'+I.phone+'</button></div>';}).join("");
  var ins=m.insurances.map(function(x){
    return '<div class="card"><div class="ins-top"><div class="ins-ic">'+I.shield+'</div>'
      +'<div><div class="ins-name">'+esc(x.name)+'</div><div class="ins-co">'+esc(x.co)+'</div></div></div>'
      +'<div class="grid2"><div class="field"><div class="lbl">証券番号</div><div class="val">'+esc(x.no)+'</div></div>'
      +'<div class="field"><div class="lbl">月額</div><div class="val">'+esc(x.fee)+'</div></div></div>'
      +'<div class="field full"><div><div class="lbl">担当者</div><div class="val">'+esc(x.agent)+' <span style="color:var(--muted);font-weight:400;font-size:13px">'+esc(x.tel)+'</span></div></div>'
      +'<button class="callbtn" onclick="toast(\'発信\')">'+I.phone+'</button></div></div>';}).join("");
  return '<div class="backbar"><button class="back" onclick="go(null)">'+I.back+' 共有相手に戻る</button></div>'
    +'<div class="person-head"><div class="av">'+m.init+'</div><div class="nm">'+m.name+'さん</div></div>'
    +'<div class="emg"><div class="et">'+I.alert+' 緊急連絡先</div><div class="ed">'+m.name+'さんに万一の際はこちらへ</div>'+emg+'</div>'
    +'<div class="sub-label">'+m.name+'さんの保険</div>'+ins;
}

/* ---------- nav ---------- */
function tabbar(){
  var tabs=[["home","マイ保険",I.shield],["family","共有相手",I.people],["settings","設定",I.gear]];
  document.getElementById("tabbar").innerHTML=tabs.map(function(t){
    return '<button class="'+(state.tab==t[0]&&!state.page?"act":"")+'" onclick="goTab(\''+t[0]+'\')">'+t[2]+'<span>'+t[1]+'</span></button>';
  }).join("");
}
function render(){
  var c=document.getElementById("content");
  var html;
  if(state.page=="add") html=screenAdd();
  else if(state.page=="approve") html=screenApprove();
  else if(state.page=="member") html=screenMember();
  else if(state.tab=="home") html=screenHome();
  else if(state.tab=="family") html=screenFamily();
  else html=screenSettings();
  c.className="pad fade"; c.innerHTML=html;
  document.getElementById("view").scrollTop=0;
  void c.offsetWidth; c.classList.remove("fade"); void c.offsetWidth; c.classList.add("fade");
  tabbar();
}
function goTab(t){state.tab=t;state.page=null;render();}
function go(p){state.page=p;if(p=="add"){state.addStep=0;state.consent=false;}render();}
function setFam(f){state.famTab=f;render();}
function toggleShare(i,el){myInsurances[i].shared=!myInsurances[i].shared;el.classList.toggle("on");toast(myInsurances[i].shared?"共有をオンにしました":"共有をオフにしました");}
function setStep(s){state.addStep=s;render();}
function addBack(){if(state.addStep>0){state.addStep--;render();}else{go(null);}}
function toggleConsent(){state.consent=!state.consent;render();}
function registerDone(){if(!state.consent){toast("同意が必要です");return;}toast("保険を登録しました");setTimeout(function(){goTab("home");},900);}
function afterApprove(msg){toast(msg);setTimeout(function(){go(null);},900);}

render();
</script>
</body>
</html>
