const ITER=ENC.iter;
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function decrypt(pw){
  const salt=b64(ENC.salt), iv=b64(ENC.iv), ct=b64(ENC.ct);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return new TextDecoder().decode(pt);
}

f.addEventListener('submit',async(ev)=>{

  try{
    const html=await decrypt(document.getElementById('pw').value);
    document.open();document.write(html);document.close();

    b.disabled=false;b.textContent='表示する';

});
