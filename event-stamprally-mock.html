<style>
 *{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;}
 body{background:#FAF9FB;color:#282829;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;}
 .card{background:#fff;border:1px solid #E6E6E6;border-radius:14px;padding:30px 28px;max-width:360px;width:100%;box-shadow:0 8px 24px rgba(27,29,59,.08);}
 .eb{color:#3438F0;font-weight:700;font-size:11px;letter-spacing:.14em;}
 h1{font-size:18px;margin:8px 0 4px;}
 p.lead{font-size:12.5px;color:#666;line-height:1.6;margin-bottom:18px;}
 input{width:100%;padding:12px 13px;border:1px solid #E6E6E6;border-radius:10px;font-size:14px;margin-bottom:10px;}
 input:focus{outline:2px solid #3438F0;outline-offset:1px;border-color:#3438F0;}
 button{width:100%;padding:12px;border:none;border-radius:10px;background:#3438F0;color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
 button:hover{background:#201DB6;}
 .err{color:#b0341f;font-size:12px;margin-top:10px;min-height:16px;}
 .foot{font-size:10.5px;color:#B3B3B3;margin-top:16px;line-height:1.5;}
</style></head>
