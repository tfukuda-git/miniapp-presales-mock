/* ===== inlined line-screen.css (未改変) ===== */
/* line-screen.css — LINE-style chat screen styles.
   Pair with line-screen.jsx. Self-contained (no external CSS vars).
   Designed to fill an IOSDevice screen via position: absolute; inset: 0. */

.ls-chat {
  position: absolute;
  inset: 0;
  background: #8db0c8;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  color: #111;
}

/* ---------- Header ---------- */
.ls-header {
  background: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid #e5e7e9;
  flex-shrink: 0;
}
.ls-hdr-left  { flex-shrink: 0; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.ls-hdr-badge { font-size: 13px; font-weight: 600; color: #111; line-height: 1; }
.ls-hdr-center { flex: 1; min-width: 0; }
.ls-hdr-title-row { display: flex; align-items: center; gap: 4px; }
.ls-hdr-title { font-size: 17px; font-weight: 700; color: #111; letter-spacing: -0.01em; }
.ls-hdr-verified { flex-shrink: 0; }
.ls-hdr-sub   { font-size: 11px; color: #8a8f95; margin-top: 1px; }
.ls-hdr-right { display: flex; gap: 14px; align-items: center; }

/* ---------- Chat area ---------- */
.ls-chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 14px;
  background: linear-gradient(180deg, #8db0c8 0%, #9cb9ce 100%);
}
.ls-date {
  text-align: center;
  background: rgba(0,0,0,0.22);
  color: #fff;
  font-size: 11px;
  padding: 3px 14px;
  border-radius: 999px;
  width: fit-content;
  margin: 4px auto 14px;
  font-weight: 500;
}

/* ---------- Message row ---------- */
.ls-msg-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.ls-msg-row.is-self { justify-content: flex-end; }
.ls-avatar-spacer   { width: 38px; flex-shrink: 0; }

.ls-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  overflow: hidden;
}
.ls-avatar img { width: 28px; height: 28px; object-fit: contain; }
.ls-avatar-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #cfd8dc;
  color: #455a64;
  font-size: 14px;
  font-weight: 700;
}

.ls-msg-group {
  display: flex;
  flex-direction: column;
  max-width: 72%;
  position: relative;
}
.ls-msg-row.is-self .ls-msg-group { align-items: flex-end; }
.ls-name { font-size: 11px; color: #fff; margin: 0 4px 3px; font-weight: 500; }

.ls-bubble {
  background: #fff;
  color: #111;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  white-space: pre-wrap;
  word-break: break-word;
}
.ls-bubble.is-self { background: #6ee17b; color: #0a3d15; }
.ls-bubble.has-image {
  padding: 4px;
  background: #fff;
}
.ls-bubble-image {
  display: block;
  max-width: 220px;
  border-radius: 12px;
}
.ls-bubble-caption { padding: 6px 8px 4px; }

.ls-time {
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  position: absolute;
  right: -44px;
  bottom: 2px;
  white-space: nowrap;
}
.ls-msg-row.is-self .ls-time {
  left: -44px;
  right: auto;
}

/* ---------- Typing indicator + bubble entry animation ---------- */
.ls-typing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fff;
  border-radius: 18px;
  padding: 12px 14px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  animation: ls-bubble-in 260ms cubic-bezier(0.22, 1, 0.36, 1);
  transform-origin: left center;
}
.ls-msg-row.is-self .ls-typing { transform-origin: right center; }
.ls-typing > span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #a8afb3;
  animation: ls-typing-dot 1.1s infinite ease-in-out;
}
.ls-typing > span:nth-child(2) { animation-delay: 0.18s; }
.ls-typing > span:nth-child(3) { animation-delay: 0.36s; }
@keyframes ls-typing-dot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30%           { transform: translateY(-3px); opacity: 1; }
}
@keyframes ls-bubble-in {
  0%   { opacity: 0; transform: translateY(6px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.ls-msg-enter .ls-bubble,
.ls-msg-enter .ls-name,
.ls-msg-enter .ls-time {
  animation: ls-bubble-in 300ms cubic-bezier(0.22, 1, 0.36, 1);
  transform-origin: left center;
}
.ls-msg-row.is-self.ls-msg-enter .ls-bubble {
  transform-origin: right center;
}

.ls-richmenu {
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex-shrink: 0;
}
.ls-rm-grid {
  display: grid;

.ls-rm-col {

  flex-direction: column;
  gap: 1px;
  background: #0a0a0a;
}
.ls-rm-col > .ls-rm-tile { flex: 1; }

.ls-rm-tile {
  background: #fff;
  border: none;
  color: #1a1a1a;
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  padding: 14px;
  min-height: 89px;
  display: flex;
  flex-direction: column;
  justify-content: center;

  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
}
.ls-rm-tile > .ls-rm-icon { color: #2968d8; }

.ls-rm-tile.is-wide {

  padding: 12px 14px;

}
.ls-rm-tile.is-wide > .ls-rm-icon { color: #555; }

.ls-rm-tile.is-primary {
  align-items: stretch;
  justify-content: stretch;
  padding: 18px 18px 16px;
  min-height: 180px;
  text-align: left;
}
.ls-rm-primary-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.ls-rm-primary-eyebrow {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #2968d8;
}
.ls-rm-primary-title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 10px;
  letter-spacing: -0.02em;
  color: #1a1a1a;
}
.ls-rm-primary-foot {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
  padding-top: 14px;
}
.ls-rm-primary-deco {
  position: absolute;
  right: -14px;
  bottom: 12px;
  pointer-events: none;
  line-height: 1;
  z-index: 0;
}

/* ---------- Menu toggle bar (▼ / ▲) ---------- */
.ls-menu-toggle {
  background: #fff;
  border-top: 1px solid #e5e7e9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 14px;
  position: relative;
  flex-shrink: 0;
}
.ls-menu-toggle .is-clickable { cursor: pointer; user-select: none; }
.ls-menu-toggle-label.is-clickable:active { color: #111; }
.ls-menu-toggle-kbd.is-clickable:active { color: #111 !important; }
.ls-menu-toggle-kbd {
  position: absolute;
  left: 14px;
  font-size: 22px !important;

}
.ls-menu-toggle-label {
  font-size: 13px;
  font-weight: 500;
  color: #555;
}

/* ---------- Input bar ---------- */
.ls-input-bar {
  background: #fff;
  border-top: 1px solid #e5e7e9;
  display: flex;
  align-items: center;
  padding: 8px 12px;
  gap: 10px;
  flex-shrink: 0;

.ls-input-field {

}

    :root{ --mico:#3438F0; --mico-d:#2a2dc4; --ink:#111318; --sub:#5a616e; --hair:#e6e8ee; --danger:#d23b3b; }
    body{ margin:0; padding:34px 16px 60px; background:#f3f4f6; min-height:100vh;

<div class="lede">
  <h1>デジタル会員証ミニアプリ（アパレル）｜フェーズ1 モック</h1>
  <p>LINE公式アカウント（移行案内・リッチメニュー）は共通コンポーネント、ミニアプリ画面はその枠内に実装。<br>右パネルで画面遷移とエッジ状態（エラー／離脱→再開／登録完了／通信エラー）を切り替えられます。</p>
  <span class="conf">サンプルデータのデモです</span>
</div>

<div class="stage"><div id="mount"></div></div>

<script type="text/babel">
// iphone-frame.jsx — iOS 26 (Liquid Glass) device frame, self-contained.
// Drop-in via <script type="text/babel" src="iphone-frame.jsx"><\/script>.
// Exposes (on window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill,
//                      IOSList, IOSListRow, IOSKeyboard.
//
// Usage:
//   <IOSDevice width={390} height={844}>
//     <YourScreen/>
//   </IOSDevice>

function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>

        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>

        <svg width="27" height="13" viewBox="0 0 27 13">

}

function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark

        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'

}

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {

          <div style={{ flex: 1, overflow: 'auto', position: 'relative' }}>{children}</div>

          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',

          <div style={{
            width: 139, height: 5, borderRadius: 100,

}

function IOSKeyboard({ dark = false }) {

  const icons = {

          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

<script type="text/babel">
// line-screen.jsx — LINE-style chat screen with typed message reveal.
// Drop-in via <script type="text/babel" src="line-screen.jsx"><\/script>.
// Pair with line-screen.css. Requires React + Material Symbols Rounded font.
//
// Exposes (on window):
//   LineScreen, LineRichMenu, LineRichMenuGrid, LineRichMenuCol,
//   LineRichMenuTile, LineRichMenuPrimary
//
// Basic usage:
//   <IOSDevice><LineScreen accountName="..." messages={[...]} /></IOSDevice>
//
// Message shape:
//   { from: 'them' | 'me',
//     text?: ReactNode,    // string or JSX (use <br/> or \n for newlines)
//     image?: string,      // url for image bubble
//     delay: number,       // ms from mount when bubble appears
//     showTyping?: number, // ms to show typing dots before delay
//     time?: string }      // optional timestamp shown next to bubble
//
// To replay animations after a state change, set a key prop on <LineScreen>.

function LineScreen({
  accountName = '公式アカウント',
  avatar = null,
  messages = [],
  richMenu = null,
  dateLabel = '今日',
  onBack = null,
  headerIcons = null,
  statusBarOffset = 54,
  subtitle = null,
  verified = false,
  unreadBadge = null,
  inputBar = false,
  menuToggle = null,
  onMenuToggleClick = null,
  onKeyboardClick = null,
}) {
  // state[i] = 'typing' | 'shown' | undefined
  const [state, setState] = React.useState({});

  React.useEffect(() => {
    const timers = [];
    messages.forEach((m, i) => {
      const delay = m.delay ?? 0;
      const showTyping = m.showTyping ?? 0;
      if (showTyping > 0) {
        const typingStart = Math.max(0, delay - showTyping);
        timers.push(setTimeout(() => {
          setState(s => ({ ...s, [i]: 'typing' }));
        }, typingStart));
      }
      timers.push(setTimeout(() => {
        setState(s => ({ ...s, [i]: 'shown' }));
      }, delay));
    });
    return () => timers.forEach(clearTimeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const initial = (accountName || '?').trim().charAt(0).toUpperCase();

  return (
    <div className="ls-chat" style={{ paddingTop: statusBarOffset }}>
      {/* Header */}
      <div className="ls-header">
        <div className="ls-hdr-left" onClick={onBack || undefined}>
          <span className="material-symbols-rounded" style={{ fontSize: 22, color: '#333' }}>arrow_back_ios_new</span>
          {unreadBadge != null && <span className="ls-hdr-badge">{unreadBadge}</span>}
        </div>
        <div className="ls-hdr-center">
          <div className="ls-hdr-title-row">
            {verified && (
              <span className="material-symbols-rounded ls-hdr-verified"
                    style={{ fontSize: 18, color: '#06c755', fontVariationSettings: "'FILL' 1" }}>
                verified
              </span>
            )}
            <span className="ls-hdr-title">{accountName}</span>
          </div>
          {subtitle && <div className="ls-hdr-sub">{subtitle}</div>}
        </div>
        <div className="ls-hdr-right">
          {headerIcons || (
            <>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>search</span>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>article</span>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>menu</span>
            </>
          )}
        </div>
      </div>

      {/* Chat area */}
      <div className="ls-chat-area">
        {dateLabel && <div className="ls-date">{dateLabel}</div>}
        {messages.map((m, i) => {
          const s = state[i];
          if (!s) return null;
          const isSelf = m.from === 'me';
          const prev = i > 0 ? messages[i - 1] : null;
          const isCont = !!prev && prev.from === m.from;
          const showAvatar = !isSelf && !isCont;
          const showName = !isSelf && !isCont;

          return (
            <div
              key={i}
              className={[
                'ls-msg-row',
                isSelf ? 'is-self' : '',
                isCont ? 'is-cont' : '',
                s === 'shown' ? 'ls-msg-enter' : '',
              ].filter(Boolean).join(' ')}
            >
              {!isSelf && (showAvatar ? (
                <div className="ls-avatar">
                  {avatar
                    ? <img src={avatar} alt=""/>
                    : <div className="ls-avatar-placeholder">{initial}</div>}
                </div>
              ) : (
                <div className="ls-avatar-spacer"/>
              ))}
              <div className="ls-msg-group">
                {showName && <div className="ls-name">{accountName}</div>}
                {s === 'typing' ? (
                  <div className="ls-typing"><span/><span/><span/></div>
                ) : (
                  <>
                    <div className={[
                      'ls-bubble',
                      isSelf ? 'is-self' : '',
                      m.image ? 'has-image' : '',
                    ].filter(Boolean).join(' ')}>
                      {m.image && <img className="ls-bubble-image" src={m.image} alt=""/>}
                      {m.text && (m.image
                        ? <div className="ls-bubble-caption">{m.text}</div>
                        : m.text)}
                    </div>
                    {m.time && <div className="ls-time">{m.time}</div>}
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Rich menu */}
      {richMenu && <div className="ls-richmenu">{richMenu}</div>}

      {/* Menu toggle bar — keyboard icon on the left (switches to input mode) +
          centred メニュー▼/▲ (toggles rich menu open/closed). */}
      {menuToggle && (
        <div className="ls-menu-toggle">
          <span
            className={[
              'material-symbols-rounded',
              'ls-menu-toggle-kbd',
              onKeyboardClick ? 'is-clickable' : '',
            ].filter(Boolean).join(' ')}
            onClick={onKeyboardClick || undefined}
            role={onKeyboardClick ? 'button' : undefined}
          >keyboard</span>
          <span
            className={['ls-menu-toggle-label', onMenuToggleClick ? 'is-clickable' : ''].filter(Boolean).join(' ')}
            onClick={onMenuToggleClick || undefined}
            role={onMenuToggleClick ? 'button' : undefined}
          >メニュー{menuToggle === 'open' ? '▼' : '▲'}</span>
        </div>
      )}

      {/* Input bar — typical LINE chat composer */}
      {inputBar && (
        <div className="ls-input-bar">
          <span className="material-symbols-rounded">add</span>
          <span className="material-symbols-rounded">photo_camera</span>
          <span className="material-symbols-rounded">image</span>
          <div className="ls-input-field">Aa</div>
          <span className="material-symbols-rounded">sentiment_satisfied</span>
          <span className="material-symbols-rounded">mic</span>
        </div>
      )}
    </div>
  );
}

// ---------- Rich menu helpers ----------

function LineRichMenu({ children }) {
  // The richMenu prop on LineScreen already wraps children in .ls-richmenu.
  // This component is for cases where you build the menu standalone, or
  // want explicit semantic grouping. Renders as a Fragment.
  return <>{children}</>;
}

function LineRichMenuGrid({ cols = '1fr 1fr', children, style }) {
  return (
    <div className="ls-rm-grid" style={{ gridTemplateColumns: cols, ...style }}>
      {children}
    </div>
  );
}

function LineRichMenuCol({ children }) {
  return <div className="ls-rm-col">{children}</div>;
}

function LineRichMenuTile({
  icon = null,
  iconSize,
  label,
  onClick,
  wide = false,
  children,
  style,
}) {
  const cls = ['ls-rm-tile', wide ? 'is-wide' : ''].filter(Boolean).join(' ');
  const defaultIconSize = wide ? 20 : 22;
  if (children) {
    return <button className={cls} onClick={onClick} style={style}>{children}</button>;
  }
  return (
    <button className={cls} onClick={onClick} style={style}>
      {icon && (
        <span className="material-symbols-rounded ls-rm-icon"
              style={{ fontSize: iconSize ?? defaultIconSize }}>
          {icon}
        </span>
      )}
      {label && <span>{label}</span>}
    </button>
  );
}

function LineRichMenuPrimary({
  eyebrow,
  eyebrowIcon,
  title,
  foot,
  footIcon = 'arrow_forward',
  decoration,
  onClick,
  style,
}) {
  return (
    <button className="ls-rm-tile is-primary" onClick={onClick} style={style}>
      <div className="ls-rm-primary-inner">
        {eyebrow && (
          <div className="ls-rm-primary-eyebrow">
            {eyebrowIcon && (
              <span className="material-symbols-rounded"
                    style={{ fontSize: 14, fontVariationSettings: "'FILL' 1" }}>
                {eyebrowIcon}
              </span>
            )}
            {eyebrow}
          </div>
        )}
        {title && <div className="ls-rm-primary-title">{title}</div>}
        {foot && (
          <div className="ls-rm-primary-foot">
            <span>{foot}</span>
            {footIcon && (
              <span className="material-symbols-rounded" style={{ fontSize: 18 }}>
                {footIcon}
              </span>
            )}
          </div>
        )}
      </div>
      {decoration && <div className="ls-rm-primary-deco">{decoration}</div>}
    </button>
  );
}

Object.assign(window, {
  LineScreen,
  LineRichMenu,
  LineRichMenuGrid,
  LineRichMenuCol,
  LineRichMenuTile,
  LineRichMenuPrimary,
});

</script>

<script type="text/babel" data-presets="react">

const {useState} = React;
const STORES = ['新宿','渋谷','池袋','横浜','大阪梅田','名古屋栄','札幌','福岡天神','仙台','広島'];

// ---- barcode bars ----
function Barcode(){
  const seed=[2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,1,2,1,2,3,1,1,1,2,1,3,2,1,1,2,1,1,3,1,2,1,2,1,3,1,1,2,1,1,2,3,1,1,2];
  return <div className="barcode">{seed.map((w,i)=><i key={i} style={{width:w+'px',background:i%2?'transparent':'#111'}}/>)}</div>;
}

function AppHeader({title,sub,onBack}){
  return <div className="app-head">
    {onBack && <button className="back" onClick={onBack}>‹</button>}
    <div className="brand">{title}{sub && <small>{sub}</small>}</div>
    <span className="close" onClick={onBack}>✕</span>
  </div>;
}

function Mock(){
  const [screen,setScreen]=useState('line');   // line, intro, form, scan, manual, confirm, done, card
  const [k,setK]=useState(0);                    // replay key for LineScreen
  const [birth,setBirth]=useState('');
  const [stores,setStores]=useState([]);
  const [memno,setMemno]=useState('');
  const [manual,setManual]=useState('');
  const [formErr,setFormErr]=useState(false);
  const [storeMsg,setStoreMsg]=useState('1つ以上、3つまで選択してください');
  const [resume,setResume]=useState(false);
  const [submitting,setSubmitting]=useState(false);
  const [toast,setToast]=useState(false);
  const [cardOffline,setCardOffline]=useState(false);
  const [bright,setBright]=useState(false);

  const go=(s)=>{ setScreen(s); };
  const openApp=()=>{ setResume(false); go('intro'); };

  const toggleStore=(name)=>{
    setStores(prev=>{
      if(prev.includes(name)) return prev.filter(x=>x!==name);
      if(prev.length>=3){ setStoreMsg('お気に入り店舗は最大3つまでです'); setFormErr(true); return prev; }
      return [...prev,name];
    });
  };
  const formValid = birth!=='' && stores.length>=1 && stores.length<=3;

  const fmtNo=(n)=> (n||'').replace(/(\d{4})(\d{4})(\d{5})/,'$1 $2 $3');
  const manualValid = /^\d{13}$/.test(manual);

  const register=()=>{
    if(submitting) return;
    setSubmitting(true);
    setTimeout(()=>{
      setSubmitting(false);
      if(!birth) setBirth('8月');
      if(!stores.length) setStores(['新宿','横浜']);
      if(!memno) setMemno('4901234567890');
      go('done');
      setTimeout(()=>{ setToast(true); setTimeout(()=>setToast(false),3800); },500);
    },1500);
  };

  // ---- scenario helpers ----
  const scnFormError=()=>{ setBirth(''); setStores([]); setFormErr(true); setStoreMsg('1つ以上、3つまで選択してください'); go('form'); };
  const scnScanFail=()=>{ setManual(''); go('manual'); };
  const scnResume=()=>{ setBirth('8月'); setStores(['新宿','横浜']); setResume(true); go('intro'); };
  const scnSubmitting=()=>{ if(!birth)setBirth('8月'); if(!stores.length)setStores(['新宿','横浜']); if(!memno)setMemno('4901234567890'); go('confirm'); setTimeout(register,300); };
  const scnCardOffline=()=>{ setCardOffline(true); go('card'); };

  const leaveConfirm=()=>{ if(birth||stores.length) setResume(true); go('line'); };

  // ---------- LINE rich menu ----------
  const richMenu = (
    <LineRichMenuGrid cols="1fr 1fr 1fr">
      <LineRichMenuTile icon="badge" label="会員証" onClick={openApp}/>
      <LineRichMenuTile icon="local_offer" label="クーポン"/>
      <LineRichMenuTile icon="store" label="店舗を探す"/>
    </LineRichMenuGrid>
  );

  const lineMessages = [
    { from:'them', text:<>友だち追加ありがとうございます。</>, delay:500, time:'10:24' },
    { from:'them', text:<>会員証がLINEで使えるようになりました。{'\n'}紙のメンバーズカードを、デジタル会員証に切り替えできます（約1分）。</>, delay:1500, showTyping:700, time:'10:24' },
    { from:'them', text:<>下のメニュー「会員証」から登録をはじめてください。</>, delay:2800, showTyping:600, time:'10:24' },
  ];

  // ---------- mini-app screens ----------
  function renderApp(){
    if(screen==='intro') return (
      <div className="app">
        <AppHeader title="デジタル会員証" sub="STYLE SUITS ミニアプリ" onBack={()=>go('line')}/>
        <div className="app-scroll">
          {resume && <div className="resume">前回の続きから再開できます。入力内容（誕生月・お気に入り店舗）は保存されています。</div>}
          <div className="pad">
            <div className="eyebrow">STEP 1 / 3　はじめに</div>
            <h3 className="t">紙のカードを、<br/>スマホの会員証に。</h3>
            <p className="d">流れは3ステップです。<br/>① 誕生月・お気に入り店舗を登録<br/>② 紙カードの会員番号をスキャン<br/>③ 会員証バーコードが完成</p>
            <div className="note">氏名・電話番号の入力は不要です。会員番号とLINEアカウントを紐づけて登録します。</div>
            <button className="btn" onClick={()=>go('form')}>登録をはじめる</button>
          </div>
        </div>
      </div>
    );

    if(screen==='form') return (
      <div className="app">
        <AppHeader title="会員情報の登録" sub="STEP 2 / 3" onBack={leaveConfirm}/>
        <div className="steps"><span className="dot on"/><span className="dot on"/><span className="dot"/></div>
        <div className="app-scroll"><div className="pad">
          <h3 className="t" style={{fontSize:17}}>よく使う情報を登録</h3>
          <p className="d">配信のパーソナライズに使います。後から変更できます。</p>

          <div className={"field"+((formErr&&!birth)?" bad":"")}>
            <label className="f">誕生月<span className="req">必須</span></label>
            <select value={birth} onChange={e=>{setBirth(e.target.value); setFormErr(false);}}>
              <option value="">選択してください</option>
              {Array.from({length:12},(_,i)=>i+1).map(m=><option key={m} value={m+'月'}>{m}月</option>)}
            </select>
            <div className={"err"+((formErr&&!birth)?" show":"")}>⚠ 誕生月を選択してください</div>
          </div>

          <div className={"field"+((formErr&&!(stores.length>=1&&stores.length<=3))?" bad":"")}>
            <label className="f">お気に入り店舗<span className="req">必須・最大3つ</span></label>
            <div className="chips">
              {STORES.map(s=><div key={s} className={"chip"+(stores.includes(s)?" sel":"")} onClick={()=>{toggleStore(s); setFormErr(false);}}>{s}</div>)}
            </div>
            <div className={"err"+((formErr&&!(stores.length>=1&&stores.length<=3))?" show":"")}>⚠ {storeMsg}</div>
            <div className="hint" style={{marginTop:8}}>よく行く店舗のクーポンや在庫情報が届きます。</div>
          </div>

          <button className="btn" disabled={!formValid}
            onClick={()=>{ if(!formValid){setFormErr(true);return;} go('scan'); }}>会員番号のスキャンへ</button>
        </div></div>
      </div>
    );

    if(screen==='scan') return (
      <div className="app" style={{paddingTop:0,background:'#0f1115'}}>
        <div style={{paddingTop:54}}><AppHeader title="" sub="" onBack={()=>go('form')}/></div>
        <div className="scanwrap">
          <div className="scan-top">STEP 3 / 3　会員番号をスキャン</div>
          <div className="frame"><div className="scanline" style={{top:'20%'}}/></div>
          <div className="scan-hint">紙のメンバーズカードのバーコードを<br/>枠に合わせると自動で読み取ります</div>
        </div>
        <div style={{padding:'14px 18px 22px',background:'#0f1115'}}>
          <button className="btn" onClick={()=>{ setMemno('4901234567890'); go('confirm'); }}>（デモ）読み取り成功</button>
          <button className="btn ghost" style={{background:'transparent'}} onClick={()=>{setManual('');go('manual');}}>（デモ）読み取り失敗 → 手入力</button>
        </div>
      </div>
    );

    if(screen==='manual') return (
      <div className="app">
        <AppHeader title="会員番号を入力" sub="スキャンできない場合" onBack={()=>go('scan')}/>
        <div className="app-scroll"><div className="pad">
          <div className="mc-banner" style={{marginBottom:6}}>バーコードを読み取れませんでした。カード裏面の番号を手入力してください。</div>
          <label className="f">会員番号（半角数字13桁）<span className="req">必須</span></label>
          <input type="text" inputMode="numeric" maxLength={13} placeholder="例）4901234567890"
            value={manual} onChange={e=>setManual(e.target.value.replace(/[^\d]/g,''))}/>
          <div className={"err"+((manual.length>0&&!manualValid)?" show":"")}>⚠ 半角数字13桁で入力してください（現在 {manual.length} 桁）</div>
          <button className="btn" disabled={!manualValid} onClick={()=>{ setMemno(manual); go('confirm'); }}>確認へ進む</button>
          <button className="btn ghost" onClick={()=>go('scan')}>もう一度スキャンする</button>
        </div></div>
      </div>
    );

    if(screen==='confirm') return (
      <div className="app">
        <AppHeader title="登録内容の確認" onBack={()=>go('scan')}/>
        <div className="app-scroll"><div className="pad">
          <h3 className="t" style={{fontSize:17}}>この内容で登録します</h3>
          <p className="d">会員番号とLINEアカウントを紐づけます。</p>
          <div style={{border:'1px solid var(--hair)',borderRadius:12,overflow:'hidden'}}>
            {[['会員番号',fmtNo(memno)||'—'],['誕生月',birth||'—'],['お気に入り店舗',stores.length?stores.join('・'):'—']].map((r,i,a)=>
              <div key={r[0]} style={{display:'flex',justifyContent:'space-between',padding:'13px 14px',fontSize:13,borderBottom:i<a.length-1?'1px solid var(--hair)':'none'}}>
                <span style={{color:'var(--sub)'}}>{r[0]}</span><b style={{textAlign:'right',maxWidth:'60%'}}>{r[1]}</b>
              </div>
            )}
          </div>
          <button className="btn" disabled={submitting} onClick={register}>
            {submitting ? <span><span className="spin"/>登録処理中…</span> : '登録する'}
          </button>
          <div className="hint" style={{textAlign:'center',marginTop:10}}>登録すると利用規約・プライバシーポリシーに同意したものとみなされます。</div>
        </div></div>
      </div>
    );

    if(screen==='done') return (
      <div className="app">
        <div className="done">
          <div className="ok">✓</div>
          <h3>会員登録が完了しました</h3>
          <p>デジタル会員証が使えるようになりました。<br/>LINEのトークにも会員証リンクが届きます。</p>
          <button className="btn" style={{maxWidth:220}} onClick={()=>{setCardOffline(false);go('card');}}>会員証を表示する</button>
        </div>
      </div>
    );

    if(screen==='card') return (
      <div className="app" style={{paddingTop:54, filter: bright?'brightness(1.15)':'none'}}>
        <AppHeader title="デジタル会員証" onBack={()=>go('line')}/>
        <div className="mc" onClick={()=>{setBright(true); setTimeout(()=>setBright(false),900);}}>
          {cardOffline && <div className="mc-banner">現在オフラインのため最新情報を取得できません。会員証バーコードは表示できます。</div>}
          <div className="mc-card">
            <div className="mc-brand"><b>STYLE SUITS</b><span className="rank">MEMBER</span></div>
            <Barcode/>
            <div className="mc-no">{fmtNo(memno)||'4901 2345 67890'}</div>
            <div className="mc-cap">お会計時にこのバーコードをご提示ください</div>
          </div>
          <div className="mc-meta">
            <div className="m"><span>誕生月</span><b>{birth||'8月'}</b></div>
            <div className="m"><span>お気に入り店舗</span><b>{stores.length?stores.slice(0,2).join('・')+(stores.length>2?' 他':''):'新宿'}</b></div>
          </div>
          <div className="mc-note">画面をタップすると明るさが上がり、POSで読み取りやすくなります。</div>
        </div>
      </div>
    );
    return null;
  }

  return (
    <div style={{display:'flex',gap:26,alignItems:'flex-start',flexWrap:'wrap',justifyContent:'center'}}>
      <div className="stage">
        <IOSDevice width={390} height={844}>
          <div style={{position:'relative',height:'100%'}}>
            {screen==='line'
              ? <LineScreen key={k} accountName="STYLE SUITS" verified subtitle="公式アカウント"
                  messages={lineMessages} richMenu={richMenu}/>
              : renderApp()}
            {toast && <div className="toast"><div className="lg">L</div><div>STYLE SUITS<br/>会員登録ありがとうございます。会員証はこちら▼</div></div>}
          </div>
        </IOSDevice>
        <div style={{textAlign:'center'}}>
          <button className="replay-btn" onClick={()=>{ setScreen('line'); setK(x=>x+1); }}>▶ LINE画面を最初から再生</button>
        </div>
      </div>

      <div className="panel">
        <div className="grp">
          <h2>画面フロー</h2>
          {[['0','LINEトーク（移行案内）','line'],['1','ミニアプリ・はじめに','intro'],['2','登録フォーム','form'],['3','会員番号スキャン','scan'],['4','登録内容の確認','confirm'],['5','会員証を表示','card']].map(x=>
            <button key={x[0]} className="scn" onClick={()=>{ if(x[2]==='confirm'){scnSubmittingPrep();} go(x[2]); }}><span className="n">{x[0]}</span>{x[1]}</button>
          )}
        </div>
        <div className="grp">
          <h2>シナリオ（エッジ状態）</h2>
          <button className="scn alt" onClick={scnFormError}><span className="n">A</span>入力エラー（未選択）</button>
          <button className="scn alt" onClick={scnScanFail}><span className="n">B</span>スキャン失敗→手入力</button>
          <button className="scn alt" onClick={scnResume}><span className="n">C</span>途中離脱→再開</button>
          <button className="scn alt" onClick={scnSubmitting}><span className="n">D</span>送信中（二重送信防止）</button>
          <button className="scn alt" onClick={scnCardOffline}><span className="n">E</span>会員証・通信エラー時</button>
          <div className="hint">商談で「エラーは？途中でやめたら？」に耐えるよう、正常系だけでなく異常系も用意しています。</div>
        </div>
      </div>
    </div>
  );

  function scnSubmittingPrep(){ if(!memno) setMemno('4901234567890'); if(!birth) setBirth('8月'); if(!stores.length) setStores(['新宿','横浜']); }
}

ReactDOM.createRoot(document.getElementById('mount')).render(<Mock/>);

</script>

<div class="foot">© Mico Inc. ｜ CONFIDENTIAL ／ デジタル会員証ミニアプリ フェーズ1 実装イメージ（サンプル）／ mock-component ベース</div>
</body>
