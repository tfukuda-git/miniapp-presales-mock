<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運用管理画面 たたき v0.2 — はなさく生命 家族あんしん共有</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#c8375d; --brand-d:#a62b4c; --brand-soft:#fdeef2; --brand-soft2:#fbe4ea;
  --ink:#1f2430; --ink2:#4a5160; --muted:#8a92a3; --line:#e7e9ef; --bg:#f4f6fa; --card:#fff;
  --green:#1f9d6b; --amber:#c98a17; --blue:#3560d8;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;}
.app{display:flex;min-height:100vh}
.side{width:236px;background:#1c1230;color:#cfc7dd;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff}
.brand .bt{font-weight:700;color:#fff;font-size:14px;line-height:1.25}
.brand .bs{font-size:10.5px;color:#9c93ad}
.navlab{font-size:10.5px;color:#7d7390;letter-spacing:.04em;padding:14px 18px 6px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;color:#cfc7dd;cursor:pointer}
.nav a:hover{background:#2a1e40}
.nav a.on{background:var(--brand);color:#fff}
.side .foot{margin-top:auto;padding:14px 18px;font-size:11px;color:#8a819c;border-top:1px solid #2c2140}
.main{flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .sub{font-size:12px;color:var(--muted)}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:var(--brand-soft);color:var(--brand-d);padding:5px 10px;border-radius:999px;font-weight:500}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:30px;height:30px;border-radius:50%;background:#d9dae2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555}
.who .nm{font-size:12.5px;font-weight:700}.who .rl{font-size:10.5px;color:var(--muted)}
.wrap{padding:22px 26px 40px;max-width:1120px}
.tag-taki{display:inline-block;background:#fff4d6;color:#8a6400;border:1px solid #f0dca0;font-size:11px;padding:3px 9px;border-radius:6px;margin-bottom:14px}
.note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;margin-top:3px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel h3{font-size:13.5px;margin:0 0 10px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:12px}
.bar{height:9px;background:var(--brand-soft2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--brand);border-radius:99px}
.donut{display:flex;gap:16px;align-items:center}
.donut .ring{width:104px;height:104px;border-radius:50%;flex-shrink:0}
.donut .lg{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.donut .lg span{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.btn{border:none;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn-ghost:hover{background:#f7f8fb}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10.5px;color:var(--muted)}
.field select,.field input{font-family:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field input{width:100%}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{background:#f7f8fb;color:var(--ink2);font-weight:700;font-size:11px}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:700}
.badge.ok{background:#e5f5ee;color:var(--green)} .badge.no{background:#eef1f6;color:var(--muted)}
.fmt{margin-top:12px;font-size:11.5px;color:var(--ink2);background:#fbfbfd;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.fmt b{color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.col{font-size:11px;background:var(--brand-soft);color:var(--brand-d);border:1px solid var(--brand-soft2);border-radius:6px;padding:3px 8px}
.col.opt{background:#eef1f6;color:var(--ink2);border-color:var(--line)}
.col.off{background:#fff;color:#b9bec9;border-color:var(--line);text-decoration:line-through}
.small{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2430;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div>
      <div><div class="bt">家族あんしん共有</div><div class="bs">はなさく生命 ・ 運用管理</div></div></div>
    <div class="navlab">メニュー</div>
    <nav class="nav" id="nav">
      <a data-act="nav" data-v="dash" class="on">📊 <span>ダッシュボード</span></a>
      <a data-act="nav" data-v="members">👤 <span>契約者一覧</span></a>
      <a data-act="nav" data-v="shares">👨‍👩‍👧 <span>共有関係</span></a>
    </nav>
    <div class="navlab">その他</div>
    <nav class="nav">
      <a data-act="toast" data-v="設定（たたきのため未実装）">⚙️ <span>設定・権限</span></a>
    </nav>
    <div class="foot">たたき版 v0.2（7/25 FB反映）<br>※データはサンプルです</div>
  </aside>

  <div class="main">
    <div class="top">
      <div><h1 id="ttl">ダッシュボード</h1><div class="sub" id="tsub">登録・共有状況のサマリ</div></div>
      <div class="spacer"></div>
      <span class="pill">🔒 権限：スーパーバイザー</span>
      <div class="who"><div class="av">監</div><div><div class="nm">運用担当</div><div class="rl">はなさく生命</div></div></div>
    </div>
    <div class="wrap" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== sample data ===== */
var stats={contractors:1284, policies:2761, shares:642, families:598, thisMonth:143, sharedMembers:840, noShareMembers:444};
var insurers=[["はなさく生命",520],["第一生命",312],["日本生命",268],["ソニー生命",190],["メットライフ生命",151],["その他",320]];
var members=[
 {uid:"U-1001",name:"田中 太郎",tel:"090-1234-5678",bd:"1975-03-20",reg:"2026-09-14",p:3,sp:2},
 {uid:"U-1002",name:"佐藤 花子",tel:"080-2222-3333",bd:"1982-07-02",reg:"2026-09-15",p:1,sp:1},
 {uid:"U-1003",name:"鈴木 一郎",tel:"090-9999-0000",bd:"1968-11-11",reg:"2026-09-16",p:5,sp:0},
 {uid:"U-1004",name:"高橋 美咲",tel:"070-4444-5555",bd:"1990-01-30",reg:"2026-09-17",p:2,sp:1}
];
/* 共有関係：続柄・ステータス・共有保険数は現フェーズ非対応のため保持しない */
var shares=[
 {cuid:"U-1001",cname:"田中 太郎",fuid:"F-2001",fname:"田中 花子",date:"2026-09-20"},
 {cuid:"U-1001",cname:"田中 太郎",fuid:"F-2002",fname:"田中 一郎",date:"2026-09-21"},
 {cuid:"U-1002",cname:"佐藤 花子",fuid:"F-2003",fname:"佐藤 健",date:"2026-09-22"},
 {cuid:"U-1004",cname:"高橋 美咲",fuid:"F-2004",fname:"高橋 節子",date:"2026-09-23"}
];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function el(id){return document.getElementById(id);}
function toast(m){var t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},2400);}
var titles={dash:["ダッシュボード","登録・共有状況のサマリ"],members:["契約者一覧","契約者を検索・確認、CSV出力"],shares:["共有関係","誰が誰に共有したか、CSV出力"]};

function table(head,rows,numCols){
  return '<div class="tblwrap"><table><thead><tr>'+head.map(function(h,i){return '<th class="'+((numCols&&numCols.indexOf(i)>=0)?"num":"")+'">'+esc(h)+'</th>';}).join("")+'</tr></thead><tbody>'
   +rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td class="'+((numCols&&numCols.indexOf(i)>=0)?"num":"")+'">'+ (c==="__ok"?'<span class="badge ok">共有あり</span>': c==="__no"?'<span class="badge no">未共有</span>': esc(c)) +'</td>';}).join("")+'</tr>';}).join("")
   +'</tbody></table></div>';
}

function viewDash(){
  var maxi=Math.max.apply(null,insurers.map(function(i){return i[1];}));
  var bars=insurers.map(function(i){return '<div class="barrow"><span>'+esc(i[0])+'</span><div class="bar"><span style="width:'+Math.round(i[1]/maxi*100)+'%"></span></div><b>'+i[1]+'</b></div>';}).join("");
  var sh=stats.sharedMembers, ns=stats.noShareMembers, tot=sh+ns, deg=Math.round(sh/tot*360);
  var donut='<div class="donut"><div class="ring" style="background:conic-gradient(var(--brand) 0 '+deg+'deg,#e9e6ee '+deg+'deg 360deg)"></div>'
   +'<div class="lg"><span><span class="dot" style="background:var(--brand)"></span>共有あり契約者 <b>'+sh.toLocaleString()+'</b></span>'
   +'<span><span class="dot" style="background:#e9e6ee"></span>未共有 <b>'+ns.toLocaleString()+'</b></span>'
   +'<span class="small">共有された家族 '+stats.families.toLocaleString()+' 名</span></div></div>';
  return '<div class="tag-taki">たたき版 v0.2 ・ サンプルデータ</div>'
   +'<div class="note">7/25FB反映：既存データで算出できる項目のみ表示。更新時期・担当者退職・承認待ちなど<b>入力/ステータスに依存する指標は現フェーズでは非表示</b>。表示項目が定義されればダッシュボードは実装可能（畑さん）。</div>'
   +'<div class="kpis">'
   +kpi("登録契約者数",stats.contractors.toLocaleString(),"+"+stats.thisMonth+" 今月")
   +kpi("登録保険（マイ保険）",stats.policies.toLocaleString(),"1人あたり 2.2件")
   +kpi("共有関係数",stats.shares.toLocaleString(),"アプリ内で受け取り済")
   +kpi("共有された家族",stats.families.toLocaleString(),"次世代接点")
   +'</div>'
   +'<div class="grid2">'
   +'<div class="panel"><h3>保険会社別の登録件数</h3><div class="bars">'+bars+'</div><div class="small" style="margin-top:8px">※ 他社証券も含む。自社（はなさく生命）シェアの把握に利用。</div></div>'
   +'<div class="panel"><h3>共有状況</h3>'+donut+'</div>'
   +'</div>'
   +'<div class="panel"><h3>直近の登録</h3>'+table(["契約者UID","氏名","登録日","マイ保険登録数","共有保険数"],members.map(function(m){return [m.uid,m.name,m.reg,m.p,m.sp];}),[3,4])+'</div>';
}
function kpi(l,v,d){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>';}

function viewMembers(){
  return '<div class="tag-taki">たたき版 v0.2</div>'
   +'<div class="toolbar">'
   +'<div class="field grow"><label>検索</label><input placeholder="契約者UID・氏名・電話で検索…"></div>'
   +'<div class="field"><label>保険会社（フィルタ）</label><select><option>すべて</option><option>はなさく生命</option><option>第一生命</option><option>日本生命</option><option>他社のみ</option></select></div>'
   +'<div class="field"><label>共有</label><select><option>すべて</option><option>共有あり</option><option>未共有</option></select></div>'
   +'<button class="btn btn-primary" data-act="dl" data-v="契約者ベース">⬇️ CSVダウンロード</button>'
   +'</div>'
   +'<div class="panel" style="padding:0">'+table(["契約者UID","氏名","電話番号","生年月日","登録日","マイ保険登録数","共有保険数"],members.map(function(m){return [m.uid,m.name,m.tel,m.bd,m.reg,m.p,m.sp];}),[5,6])+'</div>'
   +'<div class="fmt"><b>CSV出力項目（契約者ベース）</b> ／ 1行=1保険（契約者×マイ保険）'
   +'<div class="cols">'+cols([["契約者UID"],["氏名"],["電話番号"],["生年月日"],["登録日"],["保険会社"],["保険の種類"],["保険料"],["担当者名","opt"],["連絡先","opt"],["自由記入欄","opt"],["共有有無"]])+'</div>'
   +'<div class="small" style="margin-top:6px">※ 保険会社ベースの一覧は本画面の「保険会社フィルタ」で代替（専用ページは廃止）。証券番号はOCR実装後に付与。</div></div>';
}
function viewShares(){
  return '<div class="tag-taki">たたき版 v0.2</div>'
   +'<div class="toolbar">'
   +'<div class="field grow"><label>検索</label><input placeholder="契約者・共有先で検索…"></div>'
   +'<button class="btn btn-primary" data-act="dl" data-v="共有された家族ベース">⬇️ CSVダウンロード</button>'
   +'</div>'
   +'<div class="panel" style="padding:0">'+table(["契約者","共有先","共有開始日"],shares.map(function(s){return [s.cname+"（"+s.cuid+"）",s.fname+"（"+s.fuid+"）",s.date];}))+'</div>'
   +'<div class="fmt"><b>CSV出力項目（共有された家族ベース）</b> ／ 1行=1共有関係（誰が誰に共有したか）'
   +'<div class="cols">'+cols([["契約者UID"],["契約者氏名"],["共有先UID"],["共有先氏名"],["共有開始日"]])
   +'<span class="col off">続柄</span><span class="col off">ステータス</span><span class="col off">共有保険数</span></div>'
   +'<div class="small" style="margin-top:6px">※ 「承認待ち」ステータスはLINE個人チャットを取得できず判定不可のため非表示。共有保険数は保険単位で共有先を選ぶ仕様ではないため一旦非対応。続柄は削除。</div></div>';
}
function cols(arr){return arr.map(function(c){return '<span class="col'+(c[1]?" opt":"")+'">'+esc(c[0])+'</span>';}).join("");}

function render(v){
  var t=titles[v]||titles.dash; el("ttl").textContent=t[0]; el("tsub").textContent=t[1];
  el("content").innerHTML = v==="members"?viewMembers() : v==="shares"?viewShares() : viewDash();
  var links=document.querySelectorAll('#nav a'); for(var i=0;i<links.length;i++){links[i].classList.toggle("on", links[i].getAttribute("data-v")===v);}
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var a=e.target.closest ? e.target.closest("[data-act]") : null; if(!a)return;
  var act=a.getAttribute("data-act"), v=a.getAttribute("data-v");
  if(act==="nav")render(v);
  else if(act==="dl")toast("「"+v+"」CSVをダウンロードしました（たたき）");
  else if(act==="toast")toast(v);
});
render("dash");
</script>

<style>
#pwgate{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#3a1030 0%,#241226 55%,#160d1c 100%);display:flex;align-items:center;justify-content:center;z-index:99999;font-family:"Noto Sans JP",system-ui,sans-serif;}
#pwgate.hide{display:none;}
#pwgate .pwbox{background:#fff;border-radius:18px;padding:30px 26px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
#pwgate .pwlock{display:flex;justify-content:center;margin-bottom:12px;color:#c8375d;}
#pwgate .pwttl{font-size:14px;font-weight:700;color:#1c1c1e;margin-bottom:4px;}
#pwgate .pwsub{font-size:11px;color:#8a8a8e;margin-bottom:16px;}
#pwgate input{width:100%;padding:12px 14px;border:1px solid #e6e6e6;border-radius:12px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;}
#pwgate button{width:100%;padding:13px;border:none;border-radius:12px;background:#c8375d;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;}
#pwgate #pwerr{color:#e0453a;font-size:12px;margin-top:10px;min-height:16px;}
</style>
<div id="pwgate"><div class="pwbox">
  <div class="pwlock"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7"/></svg></div>
  <div class="pwttl">パスワードを入力してください</div>
  <div class="pwsub">家族あんしん共有サービス 運用管理画面 デモ</div>
  <input id="pwin" type="password" placeholder="パスワード" autocomplete="off">
  <button id="pwbtn">表示する</button>
  <div id="pwerr"></div>
</div></div>
<script>
(function(){var PW="kazoku-anshin";var g=document.getElementById("pwgate"),i=document.getElementById("pwin"),e=document.getElementById("pwerr");
function ok(){if(i.value===PW){g.classList.add("hide");}else{e.textContent="パスワードが違います";i.value="";}}
document.getElementById("pwbtn").addEventListener("click",ok);
i.addEventListener("keydown",function(ev){if(ev.key==="Enter")ok();});
setTimeout(function(){i.focus();},100);})();
</script>

</body>
</html>
