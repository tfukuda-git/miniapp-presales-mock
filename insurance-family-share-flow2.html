var COVS=["死亡","医療","三大疾病","資産形成","収入保障","介護","その他"];
function covField(pre,sel){sel=sel||[];return '<div class="form-field req"><div class="lbl">備えている保障（必須・複数選択可）</div><div class="covs">'+COVS.map(function(c){var on=sel.indexOf(c)>=0;return '<label class="cov'+(on?' on':'')+'"><input type="checkbox" name="'+pre+'_cov" value="'+c+'"'+(on?' checked':'')+' onchange="this.parentNode.classList.toggle(\'on\',this.checked)">'+c+'</label>';}).join("")+'</div><div style="color:#98a2b3;font-size:11px;margin-top:6px">※三大疾病＝がん・脳卒中・心筋梗塞</div></div>';}
function readCov(pre){return Array.prototype.map.call(document.querySelectorAll('input[name="'+pre+'_cov"]:checked'),function(e){return e.value;});}
function formField(lbl,ph){return '<div class="form-field"><div class="lbl">'+lbl+'</div><input type="text" placeholder="'+ph+'"></div>';}
function formFieldId(id,lbl,ph,val,ml){var im=/_(fee|tel)$/.test(id)?' inputmode="numeric"':'';return '<div class="form-field"><div class="lbl">'+lbl+'</div><input id="'+id+'" type="text"'+im+(ml?' maxlength="'+ml+'"':'')+' placeholder="'+esc(ph)+'" value="'+esc(val||"")+'"></div>';}
function formFieldDate(id,lbl,val,ahead){
  var p=(val||"").split("-");var yy=p[0]||"",mm=p[1]?String(parseInt(p[1],10)):"",dd=p[2]?String(parseInt(p[2],10)):"";
  var now=new Date().getFullYear()+(ahead||0);
  var yrs='<option value="">年</option>';for(var y=now;y>=1930;y--){yrs+='<option value="'+y+'"'+(String(y)===yy?' selected':'')+'>'+y+'</option>';}
  var mos='<option value="">月</option>';for(var m=1;m<=12;m++){mos+='<option value="'+m+'"'+(String(m)===mm?' selected':'')+'>'+m+'</option>';}
  var dys='<option value="">日</option>';for(var d=1;d<=31;d++){dys+='<option value="'+d+'"'+(String(d)===dd?' selected':'')+'>'+d+'</option>';}
  var ss='style="flex:1;min-width:0;padding:11px 8px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;-webkit-appearance:menulist;appearance:menulist"';
  return '<div class="form-field"><div class="lbl">'+lbl+'</div><div style="display:flex;gap:8px">'
    +'<select id="'+id+'_y" '+ss+'>'+yrs+'</select>'
    +'<select id="'+id+'_m" '+ss+'>'+mos+'</select>'
    +'<select id="'+id+'_d" '+ss+'>'+dys+'</select></div></div>';
}
function readDate(id){var g=function(s){var el=document.getElementById(id+s);return el?el.value:"";};var y=g("_y"),m=g("_m"),d=g("_d");if(!y||!m||!d)return "";return y+"-"+("0"+m).slice(-2)+"-"+("0"+d).slice(-2);}

    +'<div class="set-group"><div class="set-list">'+item(I.person,"プロフィール編集",nm,A("fopenProfileEdit"))+item(I.help,"アプリの使い方","",A("fopenTutorial"))+item(I.doc,"プライバシーポリシー","")+'</div></div>'
    +'<div class="ver">はなさくポケット v1.0.0<br>'+CUST+'保険株式会社</div>';

function fTutorial(){

    {img:1,h1:"かんたん登録",h2:"わたしの保険を登録",note:"保険会社と備えている保障を選ぶだけ。証券を撮影して添付でき、他社の保険もまとめて登録できます。"},
    {img:2,h1:"見せたい人に、見せたい保険だけ",h2:"家族を選んで共有",note:"共有する家族と保険は自由に選べて、いつでもオン・オフできます。招待はLINEで送るだけ。"},
    {img:3,h1:"いざという時も安心",h2:"もしもの時は緊急連絡先へ",note:"担当者や保険会社の窓口にワンタップで発信。ご家族が迷わず連絡できます。"}

  var top=famB.tuReplay

    : '<div style="text-align:right;padding:2px 2px 0"><span style="color:var(--muted);font-size:13px;cursor:pointer" '+A("ftuSkip")+'>スキップ</span></div>';
  return top
    +'<div style="background:#f1f9f4;border-radius:16px;padding:16px 14px 22px;margin-top:4px">'
    +'<div style="text-align:center;padding:8px 4px 0">'
    +(st.h1?'<div style="color:#12a594;font-weight:700;font-size:16px;margin-bottom:2px">'+st.h1+'</div>':'')
    +'<div style="color:#12a594;font-weight:800;font-size:23px;line-height:1.3">'+st.h2+'</div></div>'
    +'<div style="display:flex;justify-content:center;margin:18px 0 6px"><img src="'+ONBO_IMG[st.img]+'" alt="" style="width:300px;max-width:90%;height:auto"></div>'
    +'<div style="background:#f4f0e2;border-radius:14px;color:#5f5847;font-size:14px;line-height:1.9;padding:16px 18px;margin:8px 6px 0;text-align:center;font-weight:500">'+st.note+'</div>'
    +'<div style="text-align:center;margin:20px 0 16px">'+dots+'</div>'
    +'<div style="text-align:center"><button style="background:#f5a623;color:#fff;border:none;border-radius:24px;font-size:16px;font-weight:700;padding:13px 0;width:190px;cursor:pointer;box-shadow:0 3px 8px rgba(245,166,35,.35)" '+A("ftuNext")+'>'+(last?(famB.tuReplay?'閉じる':'はじめる'):'次へ')+'</button></div>'
    +'</div>';
}
function fProfileEdit(){
  return '<div class="backbar"><button class="back" '+A("ftab","settings")+'>'+I.back+' 設定に戻る</button></div>'
    +'<div class="head-row"><div class="h1" style="font-size:22px">プロフィール編集</div></div>'
    +formFieldId("fpe_name","お名前（必須）","例）佐藤 美咲",famB.pname||FAM,30)
    +formFieldDate("fpe_bd","生年月日（必須）",famB.pbd)

function fMember(){
  return '<div class="backbar"><button class="back" '+A("ftab","family")+'>'+I.back+' 共有相手に戻る</button></div>'+sharedBody();
}
function fShareDetailScreen(){
  return '<div class="backbar"><button class="back" '+A("fgo","member")+'>'+I.back+' 共有されている保険に戻る</button></div>'+sharedDetailBody();
}
function fShareDetail(i){famB.sharedIdx=parseInt(i,10);famB.mpage="shareddetail";renderB();}
function fRender(){
  var body,noTabs=false;
  if(!famB.tuDone||famB.mpage=="tutorial"){body=fTutorial();noTabs=true;}
  else if(famB.mpage=="profileEdit")body=fProfileEdit();
  else if(famB.mpage=="shareddetail")body=fShareDetailScreen();
  else if(famB.mpage=="member")body=fMember();
  else if(famB.mtab=="home")body=fHome();
  else if(famB.mtab=="family")body=fFamily();
  else body=fSettings();
  var tabs=[["home","わたしの保険",I.shield],["family","共有相手",I.people],["settings","設定",I.gear]];
  var tb=noTabs?'':'<div class="tabbar">'+tabs.map(function(t){return '<button class="'+((famB.mtab==t[0]&&!famB.mpage)?"act":"")+'" '+A("ftab",t[0])+'>'+t[2]+'<span>'+t[1]+'</span></button>';}).join("")+'</div>';
  return SB+'<div class="view"><div class="pad">'+body+'</div></div>'+tb+'<div class="toast" id="toastB"></div>';
}
function ftuNext(){if((famB.tuStep||0)<3){famB.tuStep=(famB.tuStep||0)+1;renderB();}else{ftuFinish();}}
function ftuFinish(){if(famB.tuReplay){famB.tuReplay=false;famB.tuStep=0;famB.mpage=null;famB.mtab="settings";}else{famB.tuDone=true;famB.tuStep=0;}renderB();}
function ftuSkip(){famB.tuDone=true;famB.tuStep=0;renderB();}
function ftuClose(){famB.tuReplay=false;famB.tuStep=0;famB.mpage=null;famB.mtab="settings";renderB();}
function fopenTutorial(){famB.tuReplay=true;famB.tuStep=0;famB.mpage="tutorial";renderB();}
function fopenProfileEdit(){famB.mpage="profileEdit";renderB();}
function fsaveProfileEdit(){var g=function(id){var el=document.getElementById(id);return el?String(el.value).trim():"";};var nm=g("fpe_name");if(!nm){toastB("氏名を入力してください");return;}var bd=readDate("fpe_bd");if(!bd){toastB("生年月日を入力してください");return;}var bdd=new Date(bd+"T00:00:00"),bp=bd.split("-");if(isNaN(bdd)||bdd.getMonth()+1!=+bp[1]||bdd>=new Date()){toastB("生年月日は過去の実在する日付を入力してください");return;}var tl=g("fpe_tel");if(tl&&!/^0\d{9,10}$/.test(tl)){toastB("電話番号は数字のみ（ハイフンなし）で入力してください");return;}famB.pname=nm;famB.ptel=g("fpe_tel");famB.pbd=readDate("fpe_bd");toastB("プロフィールを更新しました");famB.mpage=null;famB.mtab="settings";renderB();}
function famGo(step){famB.step=step;renderB();}
function openMini(v){famB.step="miniapp";if(v=="member"){famB.mtab="family";famB.mpage="member";}else{famB.mtab=v||"family";famB.mpage=null;}renderB();}
function ftab(t){famB.mtab=t;famB.mpage=null;renderB();}
function fgo(p){famB.mpage=p;renderB();}
function fsetFam(f){famB.mfamTab=f;renderB();}
function famConsent(){famB.consent=!famB.consent;if(!setCheck("fmcb","fmbtn",famB.consent))renderB();}
function famReceive(){if(!famB.consent){toastB("情報の取扱いへの同意が必要です");return;}var exists=sharedMembers.some(function(a){return a[0]==FAM;});if(!exists)sharedMembers.push([FAM,"家"]);pendingInvites.shift();famB.step="profile";renderB();render();toast(FAM+"さんが共有を受け取りました");}
function bProfile(){return SB+'<div class="view"><div class="pad">'+brandbar("はなさくポケット")+'<div class="center-title" style="margin-top:10px"><h2>プロフィール登録</h2><p>共有された保険を見るために、あなたのお名前と生年月日を登録してください</p></div>'+formFieldId("fp_name","お名前（必須）","例）佐藤 美咲",famB.pname,30)+formFieldDate("fp_bd","生年月日（必須）",famB.pbd)+formFieldId("fp_tel","電話番号（任意）","例）09000000000（ハイフンなし）",famB.ptel,30)+'<div class="note">LINEのお名前のみ取得しているため、正式なお名前をご登録ください。生年月日は同姓同名の識別に使用します。</div>'+'<div class="check-row" '+A("fpToggle")+'><div id="fpcb" class="cb'+(famB.pconsent?' on':'')+'">'+(famB.pconsent?I.check:"")+'</div><div class="ctxt">プライバシーポリシー・利用規約に同意します</div></div>'+'<button id="fpbtn" class="btn btn-brand btn-block" style="margin-top:4px;opacity:'+(famB.pconsent?1:.45)+'" '+A("fpSave")+'>登録する</button>'+'</div></div><div class="toast" id="toastB"></div>';}
function fpToggle(){famB.pconsent=!famB.pconsent;if(!setCheck("fpcb","fpbtn",famB.pconsent))renderB();}
function fpSave(){var g=function(id){var el=document.getElementById(id);return el?String(el.value).trim():"";};var nm=g("fp_name");if(!nm){toastB("氏名を入力してください");return;}var bd=readDate("fp_bd");if(!bd){toastB("生年月日を入力してください");return;}var bdd=new Date(bd+"T00:00:00"),bp=bd.split("-");if(isNaN(bdd)||bdd.getMonth()+1!=+bp[1]||bdd>=new Date()){toastB("生年月日は過去の実在する日付を入力してください");return;}var tl=g("fp_tel");if(tl&&!/^0\d{9,10}$/.test(tl)){toastB("電話番号は数字のみ（ハイフンなし）で入力してください");return;}if(!famB.pconsent){toastB("同意にチェックしてください");return;}famB.pname=nm;famB.pbd=bd;famB.ptel=tl;famB.tuDone=true;famB.step="miniapp";famB.mtab="family";famB.mpage=null;renderB();toastB(CUST+" 公式アカウントから共有開始のお知らせが届きました");}

/* ===== event delegation (インラインonclick非依存でクリック可能) ===== */
document.addEventListener("click",function(e){
  var el=e.target.closest ? e.target.closest("[data-act]") : null;
  if(!el)return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  switch(act){
    case "go": go(v?v:null); break;
    case "goTab": goTab(v); break;
    case "setFam": setFam(v); break;
    case "setStep": setStep(parseInt(v,10)); break;
    case "setMode": setMode(v); break;
    case "toggleC": toggleC(parseInt(v,10)); break;
    case "toggleP": toggleP(); break;
    case "toggleShare": toggleShare(parseInt(v,10)); break;
    case "openEdit": openEdit(parseInt(v,10)); break;
    case "openMember": openMember(parseInt(v,10)); break;
    case "openMemberIns": openMemberIns(v); break;
    case "registerDone": registerDone(); break;
    case "spGo": spClose(); state.tab="family"; go("invite"); break;
    case "spClose": spClose(); break;
    case "confirmManual": confirmManual(); break;
    case "attachPhoto": attachPhoto(); break;
    case "camAllow": camAllow(); break;
    case "camDeny": camDeny(); break;
    case "camShoot": camShoot(); break;
    case "saveProfile": saveProfile(); break;
    case "tuNext": tuNext(); break;
    case "tuSkip": tuSkip(); break;
    case "tuClose": tuClose(); break;
    case "openTutorial": openTutorial(); break;
    case "openProfileEdit": openProfileEdit(); break;
    case "saveProfileEdit": saveProfileEdit(); break;
    case "addBack": addBack(); break;
    case "saveEdit": saveEdit(); break;
    case "deleteIns": deleteIns(); break;
    case "inviteToggle": inviteToggle(); break;
    case "openPicker": openPicker(); break;
    case "pickerToggle": pickerToggle(v); break;
    case "pickerSend": pickerSend(); break;
    case "removeShare": removeShare(v); break;
    case "toast": toast(v); break;
    case "famGo": famGo(v); break;
    case "famAddDone": famAddDone(); break;
    case "famAddPopup": famAddPopup(); break;
    case "famAddClose": famAddClose(); break;
    case "famConsent": famConsent(); break;
    case "famReceive": famReceive(); break;
    case "fpToggle": fpToggle(); break;
    case "fpSave": fpSave(); break;
    case "openMini": openMini(v); break;
    case "ftab": ftab(v); break;
    case "fgo": fgo(v); break;
    case "fShareDetail": fShareDetail(v); break;
    case "fsetFam": fsetFam(v); break;
    case "ftuNext": ftuNext(); break;
    case "ftuSkip": ftuSkip(); break;
    case "ftuClose": ftuClose(); break;
    case "fopenTutorial": fopenTutorial(); break;
    case "fopenProfileEdit": fopenProfileEdit(); break;
    case "fsaveProfileEdit": fsaveProfileEdit(); break;
    case "toastB": toastB(v); break;
  }
});
