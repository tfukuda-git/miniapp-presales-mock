  line-screen.css）は変更せず参照のみ。このファイルは repo フォルダ内に置いて相対参照します。
-->

<head>
  <meta charset="utf-8"/>
  <title>薬局ロイヤリティ LINEミニアプリ モック</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <style>
/* inlined line-screen.css (未改変) */
/* line-screen.css — LINE-style chat screen styles.
   Pair with line-screen.jsx. Self-contained (no external CSS vars).
   Designed to fill an IOSDevice screen via position: absolute; inset: 0. */

.ls-chat {
  position: absolute;
  inset: 0;
  background: #8db0c8;
  display: flex;
  flex-direction: column;
  font-family: -apple-system, system-ui, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  color: #111;
}

/* ---------- Header ---------- */
.ls-header {
  background: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid #e5e7e9;
  flex-shrink: 0;
}
.ls-hdr-left  { flex-shrink: 0; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.ls-hdr-badge { font-size: 13px; font-weight: 600; color: #111; line-height: 1; }
.ls-hdr-center { flex: 1; min-width: 0; }
.ls-hdr-title-row { display: flex; align-items: center; gap: 4px; }
.ls-hdr-title { font-size: 17px; font-weight: 700; color: #111; letter-spacing: -0.01em; }
.ls-hdr-verified { flex-shrink: 0; }
.ls-hdr-sub   { font-size: 11px; color: #8a8f95; margin-top: 1px; }
.ls-hdr-right { display: flex; gap: 14px; align-items: center; }

/* ---------- Chat area ---------- */
.ls-chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 14px;
  background: linear-gradient(180deg, #8db0c8 0%, #9cb9ce 100%);
}
.ls-date {
  text-align: center;
  background: rgba(0,0,0,0.22);
  color: #fff;
  font-size: 11px;
  padding: 3px 14px;
  border-radius: 999px;
  width: fit-content;
  margin: 4px auto 14px;
  font-weight: 500;
}

/* ---------- Message row ---------- */
.ls-msg-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: flex-start;
}
.ls-msg-row.is-self { justify-content: flex-end; }
.ls-avatar-spacer   { width: 38px; flex-shrink: 0; }

.ls-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  overflow: hidden;
}
.ls-avatar img { width: 28px; height: 28px; object-fit: contain; }
.ls-avatar-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background: #cfd8dc;
  color: #455a64;
  font-size: 14px;
  font-weight: 700;
}

.ls-msg-group {
  display: flex;
  flex-direction: column;
  max-width: 72%;
  position: relative;
}
.ls-msg-row.is-self .ls-msg-group { align-items: flex-end; }
.ls-name { font-size: 11px; color: #fff; margin: 0 4px 3px; font-weight: 500; }

.ls-bubble {
  background: #fff;
  color: #111;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.55;
  letter-spacing: -0.005em;
  white-space: pre-wrap;
  word-break: break-word;
}
.ls-bubble.is-self { background: #6ee17b; color: #0a3d15; }
.ls-bubble.has-image {
  padding: 4px;
  background: #fff;
}
.ls-bubble-image {
  display: block;
  max-width: 220px;
  border-radius: 12px;
}
.ls-bubble-caption { padding: 6px 8px 4px; }

.ls-time {
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  position: absolute;
  right: -44px;
  bottom: 2px;
  white-space: nowrap;
}
.ls-msg-row.is-self .ls-time {
  left: -44px;
  right: auto;
}

/* ---------- Typing indicator + bubble entry animation ---------- */
.ls-typing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fff;
  border-radius: 18px;
  padding: 12px 14px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  animation: ls-bubble-in 260ms cubic-bezier(0.22, 1, 0.36, 1);
  transform-origin: left center;
}
.ls-msg-row.is-self .ls-typing { transform-origin: right center; }
.ls-typing > span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #a8afb3;
  animation: ls-typing-dot 1.1s infinite ease-in-out;
}
.ls-typing > span:nth-child(2) { animation-delay: 0.18s; }
.ls-typing > span:nth-child(3) { animation-delay: 0.36s; }
@keyframes ls-typing-dot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30%           { transform: translateY(-3px); opacity: 1; }
}
@keyframes ls-bubble-in {
  0%   { opacity: 0; transform: translateY(6px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.ls-msg-enter .ls-bubble,
.ls-msg-enter .ls-name,
.ls-msg-enter .ls-time {
  animation: ls-bubble-in 300ms cubic-bezier(0.22, 1, 0.36, 1);
  transform-origin: left center;
}
.ls-msg-row.is-self.ls-msg-enter .ls-bubble {
  transform-origin: right center;
}

/* ---------- Rich menu ---------- */
.ls-richmenu {
  background: #0a0a0a;
  display: flex;
  flex-direction: column;
  gap: 1px;
  flex-shrink: 0;
}
.ls-rm-grid {
  display: grid;
  gap: 1px;
  background: #0a0a0a;
}
.ls-rm-col {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: #0a0a0a;
}
.ls-rm-col > .ls-rm-tile { flex: 1; }

.ls-rm-tile {
  background: #fff;
  border: none;
  color: #1a1a1a;
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  padding: 14px;
  min-height: 89px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
}
.ls-rm-tile > .ls-rm-icon { color: #2968d8; }

.ls-rm-tile.is-wide {
  flex-direction: row;
  min-height: 48px;
  padding: 12px 14px;
  font-size: 12px;
}
.ls-rm-tile.is-wide > .ls-rm-icon { color: #555; }

.ls-rm-tile.is-primary {
  align-items: stretch;
  justify-content: stretch;
  padding: 18px 18px 16px;
  min-height: 180px;
  text-align: left;
}
.ls-rm-primary-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}
.ls-rm-primary-eyebrow {
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #2968d8;
}
.ls-rm-primary-title {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 10px;
  letter-spacing: -0.02em;
  color: #1a1a1a;
}
.ls-rm-primary-foot {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
  padding-top: 14px;
}
.ls-rm-primary-deco {
  position: absolute;
  right: -14px;
  bottom: 12px;
  pointer-events: none;
  line-height: 1;
  z-index: 0;
}

/* ---------- Menu toggle bar (▼ / ▲) ---------- */
.ls-menu-toggle {
  background: #fff;
  border-top: 1px solid #e5e7e9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 14px;
  position: relative;
  flex-shrink: 0;
}
.ls-menu-toggle .is-clickable { cursor: pointer; user-select: none; }
.ls-menu-toggle-label.is-clickable:active { color: #111; }
.ls-menu-toggle-kbd.is-clickable:active { color: #111 !important; }
.ls-menu-toggle-kbd {
  position: absolute;
  left: 14px;
  font-size: 22px !important;
  color: #6b7280 !important;
}
.ls-menu-toggle-label {
  font-size: 13px;
  font-weight: 500;
  color: #555;
}

/* ---------- Input bar ---------- */
.ls-input-bar {
  background: #fff;
  border-top: 1px solid #e5e7e9;
  display: flex;
  align-items: center;
  padding: 8px 12px;
  gap: 10px;
  flex-shrink: 0;
}
.ls-input-bar > .material-symbols-rounded {
  font-size: 24px !important;
  color: #6b7280 !important;
  flex-shrink: 0;
}
.ls-input-field {
  flex: 1;
  background: #f3f4f6;
  border-radius: 999px;
  padding: 8px 14px;
  color: #9ca3af;
  font-size: 14px;
  line-height: 1.3;
  font-family: -apple-system, system-ui, sans-serif;
}

</style>

          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',

      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,

      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,

}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {

function IOSList({ header, children, dark = false }) {

function IOSDevice({

      {/* side buttons */}
      <div style={{position:'absolute', left:-2, top:96, width:3, height:30, borderRadius:1,

      <div style={{position:'absolute', left:-2, top:140, width:3, height:56, borderRadius:1,

      <div style={{position:'absolute', left:-2, top:208, width:3, height:56, borderRadius:1,

      <div style={{position:'absolute', right:-2, top:176, width:3, height:90, borderRadius:1,
        background:'linear-gradient(90deg, #1a1a1c 0%, #3a3a3c 50%, #1a1a1c 100%)'}}/>

      <div style={{
        width: width, height: height, borderRadius: SCREEN_R, overflow: 'hidden',
        position: 'relative', background: dark ? '#000' : '#ffffff',
        boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.9), inset 0 0 2px 1px rgba(255,255,255,0.02)',
        clipPath: `inset(0 round ${SCREEN_R}px)`,
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 126, height: 37, borderRadius: 24,
          background: '#000',
          boxShadow: 'inset 0 0 0 0.5px rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.6)',

            position:'absolute', right:14, top:'50%', transform:'translateY(-50%)',

        </div>

          <IOSStatusBar dark={dark} />
        </div>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          {title !== undefined && <IOSNavBar title={title} dark={dark} />}
          <div style={{ flex: 1, overflow: 'auto', position: 'relative' }}>{children}</div>
          {keyboard && <IOSKeyboard dark={dark} />}
        </div>
        {/* home indicator */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
          paddingBottom: 8, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.35)',
          }} />

      </div>
    </div>

}

function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };
  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );
  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );
  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>
<script type="text/babel" data-presets="react">
/* inlined line-screen.jsx (未改変) */
// line-screen.jsx — LINE-style chat screen with typed message reveal.
// Drop-in via <script type="text/babel" src="line-screen.jsx"><\/script>.
// Pair with line-screen.css. Requires React + Material Symbols Rounded font.
//
// Exposes (on window):
//   LineScreen, LineRichMenu, LineRichMenuGrid, LineRichMenuCol,
//   LineRichMenuTile, LineRichMenuPrimary
//
// Basic usage:
//   <IOSDevice><LineScreen accountName="..." messages={[...]} /></IOSDevice>
//
// Message shape:
//   { from: 'them' | 'me',
//     text?: ReactNode,    // string or JSX (use <br/> or \n for newlines)
//     image?: string,      // url for image bubble
//     delay: number,       // ms from mount when bubble appears
//     showTyping?: number, // ms to show typing dots before delay
//     time?: string }      // optional timestamp shown next to bubble
//
// To replay animations after a state change, set a key prop on <LineScreen>.

function LineScreen({
  accountName = '公式アカウント',
  avatar = null,
  messages = [],
  richMenu = null,
  dateLabel = '今日',
  onBack = null,
  headerIcons = null,
  statusBarOffset = 54,
  subtitle = null,
  verified = false,
  unreadBadge = null,
  inputBar = false,
  menuToggle = null,
  onMenuToggleClick = null,
  onKeyboardClick = null,
}) {
  // state[i] = 'typing' | 'shown' | undefined
  const [state, setState] = React.useState({});

  React.useEffect(() => {
    const timers = [];
    messages.forEach((m, i) => {
      const delay = m.delay ?? 0;
      const showTyping = m.showTyping ?? 0;
      if (showTyping > 0) {
        const typingStart = Math.max(0, delay - showTyping);
        timers.push(setTimeout(() => {
          setState(s => ({ ...s, [i]: 'typing' }));
        }, typingStart));
      }
      timers.push(setTimeout(() => {
        setState(s => ({ ...s, [i]: 'shown' }));
      }, delay));
    });
    return () => timers.forEach(clearTimeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const initial = (accountName || '?').trim().charAt(0).toUpperCase();

  return (
    <div className="ls-chat" style={{ paddingTop: statusBarOffset }}>
      {/* Header */}
      <div className="ls-header">
        <div className="ls-hdr-left" onClick={onBack || undefined}>
          <span className="material-symbols-rounded" style={{ fontSize: 22, color: '#333' }}>arrow_back_ios_new</span>
          {unreadBadge != null && <span className="ls-hdr-badge">{unreadBadge}</span>}
        </div>
        <div className="ls-hdr-center">
          <div className="ls-hdr-title-row">
            {verified && (
              <span className="material-symbols-rounded ls-hdr-verified"
                    style={{ fontSize: 18, color: '#06c755', fontVariationSettings: "'FILL' 1" }}>
                verified
              </span>
            )}
            <span className="ls-hdr-title">{accountName}</span>
          </div>
          {subtitle && <div className="ls-hdr-sub">{subtitle}</div>}
        </div>
        <div className="ls-hdr-right">
          {headerIcons || (
            <>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>search</span>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>article</span>
              <span className="material-symbols-rounded" style={{ fontSize: 24, color: '#333' }}>menu</span>
            </>
          )}
        </div>
      </div>

      {/* Chat area */}
      <div className="ls-chat-area">
        {dateLabel && <div className="ls-date">{dateLabel}</div>}
        {messages.map((m, i) => {
          const s = state[i];
          if (!s) return null;
          const isSelf = m.from === 'me';
          const prev = i > 0 ? messages[i - 1] : null;
          const isCont = !!prev && prev.from === m.from;
          const showAvatar = !isSelf && !isCont;
          const showName = !isSelf && !isCont;

          return (
            <div
              key={i}
              className={[
                'ls-msg-row',
                isSelf ? 'is-self' : '',
                isCont ? 'is-cont' : '',
                s === 'shown' ? 'ls-msg-enter' : '',
              ].filter(Boolean).join(' ')}
            >
              {!isSelf && (showAvatar ? (
                <div className="ls-avatar">
                  {avatar
                    ? <img src={avatar} alt=""/>
                    : <div className="ls-avatar-placeholder">{initial}</div>}
                </div>
              ) : (
                <div className="ls-avatar-spacer"/>
              ))}
              <div className="ls-msg-group">
                {showName && <div className="ls-name">{accountName}</div>}
                {s === 'typing' ? (
                  <div className="ls-typing"><span/><span/><span/></div>
                ) : (
                  <>
                    <div className={[
                      'ls-bubble',
                      isSelf ? 'is-self' : '',
                      m.image ? 'has-image' : '',
                    ].filter(Boolean).join(' ')}>
                      {m.image && <img className="ls-bubble-image" src={m.image} alt=""/>}
                      {m.text && (m.image
                        ? <div className="ls-bubble-caption">{m.text}</div>
                        : m.text)}
                    </div>
                    {m.time && <div className="ls-time">{m.time}</div>}
                  </>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Rich menu */}
      {richMenu && <div className="ls-richmenu">{richMenu}</div>}

      {/* Menu toggle bar — keyboard icon on the left (switches to input mode) +
          centred メニュー▼/▲ (toggles rich menu open/closed). */}
      {menuToggle && (
        <div className="ls-menu-toggle">
          <span
            className={[
              'material-symbols-rounded',
              'ls-menu-toggle-kbd',
              onKeyboardClick ? 'is-clickable' : '',
            ].filter(Boolean).join(' ')}
            onClick={onKeyboardClick || undefined}
            role={onKeyboardClick ? 'button' : undefined}
          >keyboard</span>
          <span
            className={['ls-menu-toggle-label', onMenuToggleClick ? 'is-clickable' : ''].filter(Boolean).join(' ')}
            onClick={onMenuToggleClick || undefined}
            role={onMenuToggleClick ? 'button' : undefined}
          >メニュー{menuToggle === 'open' ? '▼' : '▲'}</span>
        </div>
      )}

      {/* Input bar — typical LINE chat composer */}
      {inputBar && (
        <div className="ls-input-bar">
          <span className="material-symbols-rounded">add</span>
          <span className="material-symbols-rounded">photo_camera</span>
          <span className="material-symbols-rounded">image</span>
          <div className="ls-input-field">Aa</div>
          <span className="material-symbols-rounded">sentiment_satisfied</span>
          <span className="material-symbols-rounded">mic</span>
        </div>
      )}
    </div>
  );
}

// ---------- Rich menu helpers ----------

function LineRichMenu({ children }) {
  // The richMenu prop on LineScreen already wraps children in .ls-richmenu.
  // This component is for cases where you build the menu standalone, or
  // want explicit semantic grouping. Renders as a Fragment.
  return <>{children}</>;
}

function LineRichMenuGrid({ cols = '1fr 1fr', children, style }) {
  return (
    <div className="ls-rm-grid" style={{ gridTemplateColumns: cols, ...style }}>
      {children}
    </div>
  );
}

function LineRichMenuCol({ children }) {
  return <div className="ls-rm-col">{children}</div>;
}

function LineRichMenuTile({
  icon = null,
  iconSize,
  label,
  onClick,
  wide = false,
  children,
  style,
}) {
  const cls = ['ls-rm-tile', wide ? 'is-wide' : ''].filter(Boolean).join(' ');
  const defaultIconSize = wide ? 20 : 22;
  if (children) {
    return <button className={cls} onClick={onClick} style={style}>{children}</button>;
  }
  return (
    <button className={cls} onClick={onClick} style={style}>
      {icon && (
        <span className="material-symbols-rounded ls-rm-icon"
              style={{ fontSize: iconSize ?? defaultIconSize }}>
          {icon}
        </span>
      )}
      {label && <span>{label}</span>}
    </button>
  );
}

function LineRichMenuPrimary({
  eyebrow,
  eyebrowIcon,
  title,
  foot,
  footIcon = 'arrow_forward',
  decoration,
  onClick,
  style,
}) {
  return (
    <button className="ls-rm-tile is-primary" onClick={onClick} style={style}>
      <div className="ls-rm-primary-inner">
        {eyebrow && (
          <div className="ls-rm-primary-eyebrow">
            {eyebrowIcon && (
              <span className="material-symbols-rounded"
                    style={{ fontSize: 14, fontVariationSettings: "'FILL' 1" }}>
                {eyebrowIcon}
              </span>
            )}
            {eyebrow}
          </div>
        )}
        {title && <div className="ls-rm-primary-title">{title}</div>}
        {foot && (
          <div className="ls-rm-primary-foot">
            <span>{foot}</span>
            {footIcon && (
              <span className="material-symbols-rounded" style={{ fontSize: 18 }}>
